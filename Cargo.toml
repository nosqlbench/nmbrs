[workspace]
members = [
    "nmbrs",
    "nmbrs-metrics",
    "nmbrs-metricsql",
    "nmbrs-workload",
    "nmbrs-rate",
    "nmbrs-errorhandler",
    "nmbrs-optimizers",
    "nmbrs-runtime",
    "nmbrs-tui",
    "nmbrs-web",
    "adapters/stdout",
    "adapters/testkit",
    "adapters/http",
    "adapters/plotter",
    "adapters/cql",
    "adapters/openapi",
]
# Exclude the vendored cassandra-cpp from the workspace test /
# build set. Its lib-tests link `-lcassandra` against the
# system, which we only have in the cassandra-cpp Docker
# sysroot — running `cargo test --workspace` from a clean
# checkout would otherwise fail to link. The crate still
# builds when an actual workspace member depends on it
# (adapters/cql with the engine-cassandra-cpp feature) under
# the build.sh sysroot, and its tests can be invoked
# explicitly via `cargo test -p cassandra-cpp` when desired.
exclude = [
    "vendor/cassandra-cpp",
]
resolver = "3"
default-members = [
    "nmbrs",
    "nmbrs-metrics",
    "nmbrs-metricsql",
    "nmbrs-workload",
    "nmbrs-rate",
    "nmbrs-errorhandler",
    "nmbrs-optimizers",
    "nmbrs-runtime",
    "nmbrs-tui",
    "nmbrs-web",
    "adapters/stdout",
    "adapters/testkit",
    "adapters/http",
    "adapters/plotter",
    "adapters/cql",
    "adapters/openapi",
]

# Shared package metadata inherited by every member via
# `field.workspace = true` (Cargo workspace.package inheritance).
# This is the single source of truth for the run-wide version
# bump: edit `version` here and every workspace member moves in
# lockstep. The vendored `vendor/cassandra-cpp` fork is excluded
# (it carries its own upstream-tracking version + `publish =
# false`); see its Cargo.toml for the rationale.
[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nosqlbench/nmbrs"
homepage = "https://github.com/nosqlbench/nmbrs"
readme = "README.md"

# vectordata + veks-completion are consumed from crates.io
# (1.3.1 as of 2026-06-11: vectordata renamed the predicate
# facet surface to metadata_results; veks-completion removed
# tree-global value providers in favor of per-node attachment
# and strict metadata enforcement). The
# storage-transport refactor and the cache-aware typed-scalar
# reader (which we previously pulled from the local working
# copy) are part of the public release. links/vectordata-rs is
# still kept around for visibility into upstream-in-flight
# changes but is no longer load-bearing for nmbrs builds.

# Profile settings (debug, frame pointers, etc.) live in
# `.cargo/config.toml` so they layer cleanly with the existing
# `[profile.release] debug = true` and the linker rustflags
# already declared there. See the comments in that file for the
# `force-frame-pointers` rationale (perf `--call-graph fp`
# default in `profiler=perf` mode needs them).
