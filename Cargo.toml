[workspace]
# Every crate — the core crates and the adapters (`nmbrs-adapter-<name>`) —
# lives in its own directory under `crates/`, named for the crate.
members = ["crates/*"]
# The vendored cassandra-cpp fork (published as `nmbrs-cassandra-cpp`) is not
# a member: its lib-tests link `-lcassandra` against the system, which only the
# cassandra-cpp Docker sysroot has, so `cargo test --workspace` from a clean
# checkout would fail to link. It still builds when a member depends on it
# (nmbrs-adapter-cql with the `engine-cassandra-cpp` feature) under the
# build.sh sysroot, and its tests run explicitly via
# `cargo test -p nmbrs-cassandra-cpp` from vendor/cassandra-cpp.
exclude = ["vendor/cassandra-cpp"]
resolver = "3"

# Shared package metadata inherited by every member via
# `field.workspace = true`. `version` is the one version every crate carries:
# the crates move in lockstep, so release with
# `cargo workspaces version <bump> --force '*'` — the tool otherwise skips
# crates unchanged since their last tag while their inherited version still
# moves. Each crate names its own `readme`.
[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nosqlbench/nmbrs"
homepage = "https://github.com/nosqlbench/nmbrs"

# Every internal crate, declared once: members depend on one with
# `nmbrs-<name> = { workspace = true, ... }`, so its path and version live
# here only, and a version bump rewrites them in one place.
#
# Dev-dependencies on internal crates stay plain `path` dependencies with no
# version: cargo drops a version-less path dev-dependency when packaging,
# which is what lets nmbrs-runtime dev-depend on the stdout and testkit
# adapters that depend on it.
#
# `default-features = false` on nmbrs-runtime (whose default set is empty)
# and nmbrs-adapter-cql lets the members that ask for it get it; a member
# can't turn off defaults its workspace entry leaves on.
[workspace.dependencies]
nmbrs-errorhandler = { path = "crates/nmbrs-errorhandler", version = "0.4.0" }
nmbrs-metrics = { path = "crates/nmbrs-metrics", version = "0.4.0" }
nmbrs-metricsql = { path = "crates/nmbrs-metricsql", version = "0.4.0" }
nmbrs-optimizers = { path = "crates/nmbrs-optimizers", version = "0.4.0" }
nmbrs-rate = { path = "crates/nmbrs-rate", version = "0.4.0" }
nmbrs-runtime = { path = "crates/nmbrs-runtime", version = "0.4.0", default-features = false }
nmbrs-tui = { path = "crates/nmbrs-tui", version = "0.4.0" }
nmbrs-web = { path = "crates/nmbrs-web", version = "0.4.0" }
nmbrs-workload = { path = "crates/nmbrs-workload", version = "0.4.0" }
nmbrs-adapter-cql = { path = "crates/nmbrs-adapter-cql", version = "0.4.0", default-features = false }
nmbrs-adapter-http = { path = "crates/nmbrs-adapter-http", version = "0.4.0" }
nmbrs-adapter-openapi = { path = "crates/nmbrs-adapter-openapi", version = "0.4.0" }
nmbrs-adapter-plotter = { path = "crates/nmbrs-adapter-plotter", version = "0.4.0" }
nmbrs-adapter-stdout = { path = "crates/nmbrs-adapter-stdout", version = "0.4.0" }
nmbrs-adapter-testkit = { path = "crates/nmbrs-adapter-testkit", version = "0.4.0" }

# Profile settings (debug, frame pointers, etc.) live in
# `.cargo/config.toml` so they layer cleanly with the existing
# `[profile.release] debug = true` and the linker rustflags
# already declared there. See the comments in that file for the
# `force-frame-pointers` rationale (perf `--call-graph fp`
# default in `profiler=perf` mode needs them).
