[package]
name = "nmbrs-adapter-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP adapter for nmbrs: executes workload operations as HTTP requests"
keywords = ["nosqlbench", "workload", "benchmark", "http"]
categories = ["command-line-utilities", "web-programming::http-client"]
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
nmbrs-runtime = { path = "../../nmbrs-runtime", version = "0.1.1", default-features = false }
polydat = "0.3"
nmbrs-workload = { path = "../../nmbrs-workload", version = "0.1.1" }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
inventory = "0.3.24"

[dev-dependencies]
# Integration tests stand up a tiny TcpListener that accepts
# but never responds, to verify the `on_timeout: accept`
# modifier collapses a client-side request-timeout into a
# benign empty-body OpResult instead of a phase error.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
