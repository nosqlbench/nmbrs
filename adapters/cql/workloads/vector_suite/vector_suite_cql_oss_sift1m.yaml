#!/usr/bin/env nmbrs
# vector_suite_cql_oss_sift1m.yaml — turnkey vector suite run for
# plain Cassandra 5.0.x: the OSS-dialect implementation with every
# suite param pinned to a runnable default, so the FULL suite
# executes from a single invocation:
#
#   nmbrs run workload=cql/vector_suite/vector_suite_cql_oss_sift1m
#
# or, since the file is a `#!/usr/bin/env nmbrs` script, directly:
#
#   ./adapters/cql/workloads/vector_suite/vector_suite_cql_oss_sift1m.yaml
#
# Every pin below is a re-default, not a lock — any param can
# still be overridden per invocation (`dataset=… capacity_timeout=…`),
# and the CLI always wins. Measurement parameters (sweep levels,
# probe windows, rates) intentionally stay at the blueprint's
# defaults: runtime is bounded by dataset scale and tier
# governance, never by thinning the measurement itself.
#
# Dataset: a complete reference dataset with base/query/GT facets
# plus the per-selectivity `label_*` oracle profiles the filtered
# grid enumerates — the smallest complete dataset that exercises
# every suite section. `fknn_profile=default` is the full corpus;
# the label profiles serve ONLY the filtered-search section, each
# selectivity point scored against its own prefiltered ground
# truth.
#
# Tier governance: `capacity_timeout` is re-defaulted to a bound
# suited to a local single-node target. Capacity fill terminates
# on the target's first refused insert; a local node may absorb
# writes far longer than a capacity tier is worth waiting for, so
# expiry here means what it always means — Interrupted+Failed
# with reason_class `timeout`: disqualified at this tier.

description: |
  Turnkey OSS-dialect vector suite: the full suite against a
  plain Cassandra 5.0.x target from a single invocation, pinned
  to a complete reference dataset with filtered-search oracle
  profiles. All pins are per-invocation overridable.

extends: ./vector_suite_cql_oss.yaml

params:
  dataset: sift1m
  # A keyspace of its own, so the turnkey run never shares tables
  # with another invocation of the suite on the same node.
  keyspace: vsuite_sift1m
  fknn_profile: default
  capacity_timeout: "30m"
