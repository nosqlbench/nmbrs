#!/usr/bin/env nmbrs
# CQL Vector Search — Parameter-Space Sweep Sibling
#
# Diagnostic workload that extends `full_cql_vector.yaml` (SRD-72
# `extends:`) and adds two scenarios that probe the cndb SAI vector
# index parameter space:
#
#   - `query_sweep` — runs against the existing fknn_default table
#     (no schema/rampup). Single comprehension level over the
#     query-only params (rerank_k_strategy × pruning_strategy ×
#     k × limit) at full LIMIT density.
#
#   - `idx_sweep`   — two-level comprehension. Outer level: index-
#     affecting params (source_model, maximum_node_connections,
#     construction_beam_width, enable_hierarchy,
#     neighborhood_overflow, alpha), `order extrema/1` so corners
#     run first. Each outer iter owns one table+index lifecycle
#     (teardown → schema → rampup → flush+compact+await). Inner
#     level: query-only params, one query phase per inner iter
#     against the just-built table.
#
# Usage:
#   nmbrs run workload=cql/vector_suite/full_cql_vector_sweep scenario=query_sweep
#   nmbrs run workload=cql/vector_suite/full_cql_vector_sweep scenario=idx_sweep
#
# Phase A precondition: `test_fknn` (or `fulltest`) from the parent
# workload must have populated `fknn_default` first; this scenario
# reuses that data.
#
# Phase B cost: 2^6 = 64 outer index variants × ~30 min rampup
# ≈ ~32 h dominated by rampup. Inner query slice is 4 cells × 30 s
# per variant = ~2 min. See `local/brute_force.md` for the cost-model
# analysis driving the strategy choices.

description: |
  Parameter-space sweep sibling of full_cql_vector (via
  `extends:`): adds scenarios that sweep query/index parameters
  across ranges to map recall-vs-latency behavior. Same target
  requirements as its parent.
extends: ./full_cql_vector.yaml

# ── Reified sweep dimensions ─────────────────────────────────
#
# Each axis of the cross-product is declared here as a string
# param so it's directly overridable from the CLI for
# diagnostic runs:
#
#     # Pin one variant to test a fix:
#     nmbrs run workload=cql/vector_suite/full_cql_vector_sweep scenario=idx_sweep \
#          sm_values=OTHER mnc_values=8 bw_values=50 eh_values=false \
#          nbo_v_values=1.0 nbo_label_values='"1p0"' \
#          alf_v_values=1.0 alf_label_values='"1p0"'
#
#     # Halve the sweep:
#     nmbrs run workload=... sm_values=OTHER
#
# Params are interpolated verbatim into the iter clause text
# via `{name}` substitution. The grammar of the comprehension
# clauses dictates each axis's expected form:
#   - Numeric / bool axes (mnc, bw, eh, nbo_v, alf_v, k, limit)
#     are bare comma-separated literals: `8, 128` / `1.0, 3.0`
#     / `false, true`.
#   - String-enum axes (sm) are bare comma-separated identifiers:
#     `OTHER, ADA002` — the comprehension grammar treats them
#     as opaque string literals when they don't parse as a
#     number / bool.
#   - String LABEL axes (nbo_label, alf_label) are passed
#     pre-quoted because the parallel-iter zip embeds them
#     inside a `concat(...)` call: the user writes
#     `'"1p0", "3p0"'` (single-quoted YAML string containing
#     double-quoted CQL strings).
#
# Strategy params (`rerank_k_strategy`, `pruning_strategy`) are
# bound as iter-vars at every cell — workload-param name
# collision with iter-var is rejected at scenario-tree compile
# time. The new `pvs_query_sweep` phase reads them through the
# scope chain that `set:` populates inside each inner-level
# comprehension. The corresponding `*_values` params here
# control the iter-var value LISTS.

params:
  # Curated default: `tries` = TOTAL attempts per op on retryable errors
  # (e.g. CQL request timeouts) before a failure reaches the result level
  # (SRD-82: the sigil for the conditional tries wrapper; omit it for
  # single-attempt ops). No root `timeout` — it would override each op's own
  # request timeout, clobbering long-running orchestration ops (flush /
  # compaction); set `timeout:` per-op on the read/write ops that need a
  # specific request timeout.
  tries: 21
  # ── idx_sweep dimensions (6 axes × 2 = 64 cells) ──────────
  # The iter-var name is the short form (`sm`, `mnc`, ...);
  # the param name binds the value LIST for that axis. Each
  # comment names the CQL OPTIONS key the workload's `set:`
  # shadow then maps the iter-var onto.

  # `sm` → `source_model` — the cndb `VectorSourceModel`
  # enum tag burned into the CREATE INDEX OPTIONS. Distinct
  # tags select distinct SAI build-path defaults; OTHER /
  # ADA002 are the two corners we sweep.
  sm_values:        "OTHER, ADA002"
#  sm_values:        "OTHER"

  # `mnc` → `maximum_node_connections` — the M parameter
  # of the hierarchical graph build (number of neighbors
  # each node retains in the proximity graph).
#  mnc_values:       "8"
  mnc_values:       "8, 128"

  # `bw` → `construction_beam_width` — the
  # efConstruction parameter (beam width used while
  # building the graph; larger → more accurate graph, more
  # build time).
#  bw_values:        "50"
  bw_values:        "50, 800"

  # `eh` → `enable_hierarchy` — whether to build the
  # multi-layer HNSW structure (true) or the flat in-memory
  # variant (false).
  eh_values:        [false, true]
#  eh_values:        false

  # `nbo_v` (numeric value) + `nbo_label` (table-name-safe
  # string) → `neighborhood_overflow` — the alpha-overflow
  # tolerance used during neighbor selection. The numeric
  # form flows into CREATE INDEX OPTIONS; the label form
  # (`1.0 → "1p0"`) goes into the table name (CQL
  # identifiers can't contain `.`). Parallel-iter pair —
  # both lists must stay in lockstep length-wise.
  nbo_v_values:     "1.0, 3.0"
  nbo_label_values: "1p0, 3p0"

  # `alf_v` (numeric) + `alf_label` (string) → `alpha` —
  # the alpha pruning factor (RNG-pruning threshold used
  # during graph construction). Same parallel-iter
  # value/label split as neighborhood_overflow.
#  alf_v_values:     1.0
  alf_v_values:     [1.0, 2.0]
#  alf_label_values: "1p0"
  alf_label_values: ["1p0", "2p0"]

  # ── query_sweep dimensions (4 axes × {2, 2, 1, 1} = 4 cells) ──
  # Bound at the inner level of `idx_sweep` AND as the only
  # axes of the standalone `query_sweep` scenario.

  # `rerank_k_strategy` — taxonomy at the top of this
  # workload file. Detent names use the `rerank_<descriptor>`
  # prefix so chart facet labels read cleanly:
  #   `rerank_def` — emit no `rerank_k` key (cndb's
  #                  tapered-multiplier default applies).
  #   `rerank_lim` — `rerank_k` = LIMIT (1×).
  #   `rerank_2x`  — `rerank_k` = 2 × LIMIT.
  #   `rerank_4x`  — `rerank_k` = 4 × LIMIT.
  #   `rerank_1k`  — `rerank_k` = 1000 (SAI cap;
  #                  `sai_ann_rerank_k_max_value` guardrail).
  # Drives the `rerank_k` entry of the query's
  # `WITH ann_options = {...}` clause.
  rerank_k_strategy_values: [rerank_1x, rerank_2x, rerank_lim]
#  rerank_k_strategy_values: [rerank_def, rerank_1x, rerank_2x, rerank_lim]

  # `pruning_strategy` → `use_pruning` — three detents with
  # the `pruning_<state>` prefix:
  #   `pruning_def` — omit the key; cndb's
  #                   JVECTOR_USE_PRUNING_DEFAULT applies.
  #   `pruning_off` — `use_pruning = false` (forces denser
  #                   traversal).
  #   `pruning_on`  — `use_pruning = true`.
  pruning_strategy_values:  "pruning_def, pruning_off, pruning_on"
#  pruning_strategy_values:  "pruning_def"

  # `k` — the top-K count requested by the ANN query
  # (`SELECT … ORDER BY ANN OF ? LIMIT k`). Single-element
  # default; multi-value lists span the K axis when
  # benchmarking recall@K curves.
  k_values:                 10

  # `limit` — the `LIMIT` clause value passed to Cassandra.
  # Together with `k` controls how many candidates the
  # ANN traversal returns before the top-K cut.
  limit_values:             "25, 50, 75, 100"
#  limit_values: [25]
#
# Value taxonomy (for reference, used in the iter clauses):
#
#   rerank_k_strategy ∈ { rerank_def, rerank_lim, rerank_2x, rerank_4x, rerank_1k }
#     rerank_def — emit no `rerank_k` key; cndb picks
#                  rerank_k from the source_model's tapered
#                  multiplier and may flip to brute force.
#     rerank_lim — rerank_k = LIMIT (1×).
#     rerank_2x  — rerank_k = 2 × LIMIT.
#     rerank_4x  — rerank_k = 4 × LIMIT.
#     rerank_1k  — rerank_k = 1000 (effectively the SAI cap;
#                  `sai_ann_rerank_k_max_value` guardrail).
#
#   pruning_strategy ∈ { pruning_def, pruning_off, pruning_on }
#     pruning_def — emit no `use_pruning` key; cndb's
#                   JVECTOR_USE_PRUNING_DEFAULT applies.
#     pruning_off — use_pruning = false (forces denser
#                   traversal).
#     pruning_on  — use_pruning = true.

# No workload-level bindings — the sweep computes per-iter
# label values via parallel-iter (concat-based) zipped clauses
# inside the comprehension; see the `idx_sweep` scenario below.
# Workload-level bindings can't see scenario-tree `set:` shadows,
# so any label that varies per iter must live inside the iter
# itself.

# Sweep-specific report sections — child-merged into the parent's
# `report:` (SRD-72 per-section merge). Parent's `oracles_section`
# stays intact for any test_oracles run.
report:
  sweep_query_section: |
    file sweep_query_report.md as 'PVS Query Strategy Sweep'

    text query_sweep_heading as "Introduction":
     This report covers `query_sweep`: per-query-strategy ANN/recall
     sweep against the existing `fknn_default` table. The plots
     surface the bimodal-recall regime (low-LIMIT approximate ANN)
     vs the brute-force-selected regime (high-LIMIT exact). Series
     are faceted per `(rerank_k_strategy, pruning_strategy)` so the
     two regimes are visible without averaging across LIMIT.

    plot recall_vs_qps_by_strategy:
      label: "Recall vs QPS, by query strategy"
      scale: 2
      legend: br
      # Group by the FULL phase-scope coordinate: the index-build axes
      # (sm,mnc,bw,eh,nbo_v,alf_v — the short for: iter-var labels; the
      # full source_model/… names reach the phase via `set:` and aren't
      # labels) AND the query axes (rerank/pruning/k/limit). Without the
      # index axes here, every index-build variant that shares a query
      # cell averages into ONE point — the whole 6-D index cube collapses
      # away. For a query-only run (Phase A vs fknn_default) the index
      # labels are simply absent, so the extra `by` keys are no-ops.
      y1: (cycles_total_rate, recall_mean){phase=~"pvs_query_sweep"} by (sm,mnc,bw,eh,nbo_v,alf_v,rerank_k_strategy,pruning_strategy,k,limit)
      x-legend: "QPS (log)"
      x-scale: linear
      y-side: left
      y-labels: ["recall"]
      y-ranges: [[,1.0]]
      # One line per (index-build cell × rerank × pruning × k); points
      # along each line are the limit sweep — no longer collapsed across
      # the index cube. With hundreds of such lines, the legend is keyed
      # to the strategy CHANNELS, not the lines: `color:` maps the rerank
      # strategy to a hue, `shape:` maps the pruning strategy to a marker
      # shape. Index-build cells that share a (rerank,pruning) share a
      # color+shape — distinct lines, recoverable channels, compact key.
      series: sm,mnc,bw,eh,nbo_v,alf_v,rerank_k_strategy,pruning_strategy,k
      color: rerank_k_strategy
      shape: pruning_strategy

    table recall_query_sweep:
      group_by: rerank_k_strategy,pruning_strategy
      query: recall: avg(recall_mean{k="10"}) by (rerank_k_strategy,pruning_strategy,limit)
      query: latency: avg(cycles_servicetime_mean) by (rerank_k_strategy,pruning_strategy,limit)

  sweep_idx_section: |
    file sweep_idx_report.md as 'Index-Build Parameter Sweep'

    text idx_sweep_heading as "Introduction":
     This report covers `idx_sweep`: 64 corner variants of the
     6-dimensional index-build parameter cube (source_model ×
     maximum_node_connections × construction_beam_width ×
     enable_hierarchy × neighborhood_overflow × alpha). Each
     variant runs a fixed 4-cell query slice (rerank_k_strategy
     ∈ {rerank_def, rerank_lim} × pruning_strategy
     ∈ {pruning_def, pruning_off}) at k=10, limit=50. Tuples
     are emitted in extrema-first order so early-stopping the
     run still covers the corners.

    # The index-build axes are labelled under their short for: iter-var
    # names (sm,mnc,bw,eh,nbo_v,alf_v); the full source_model/… names
    # reach the phase via `set:` as scope consts and are NOT metric
    # labels — grouping by them silently collapses to one row. Group by
    # the short names that actually exist on the samples.
    table recall_idx_sweep:
      group_by: sm,mnc,bw
      query: recall: avg(recall_mean) by (sm,mnc,bw,eh,nbo_v,alf_v,rerank_k_strategy,pruning_strategy)
      query: latency_p99: avg(cycles_servicetime_p99) by (sm,mnc,bw,eh,nbo_v,alf_v,rerank_k_strategy,pruning_strategy)

scenarios:

  # ── Phase A: query-path sweep on existing data ───────────────
  #
  # Single comprehension level — all query-only params bundled
  # into one clause list. k declared before limit so
  # `limit in {k_{k}_limits}` resolves against the freshly-bound k.
  # No schema/rampup; reuses fknn_default populated by a prior
  # `test_fknn` run.
  query_sweep:
    - for: "profile in {fknn_profile}, table in fknn_{profile}"
      phases:
        # Iter-var names here don't collide with any workload param
        # (rerank_k_strategy / pruning_strategy aren't declared in
        # the parent), so the phase below reads them directly via
        # the scope chain — no `set:` needed.
        - for: |
            rerank_k_strategy in "rerank_def, rerank_lim, rerank_2x, rerank_4x, rerank_1k",
            pruning_strategy in ["pruning_def", "pruning_off"],
            k in k_values,
            limit in {k_{k}_limits}
          phases:
            - pvs_query_sweep

  # ── Phase B: two-level index-build × query sweep ─────────────
  #
  # Outer comprehension: index-affecting params, 2 values per dim,
  # `order extrema/1`. Each tuple owns one table+index lifecycle —
  # the lifecycle phases (teardown/schema/rampup/flush/compact/
  # await) are scoped to the outer iter's closure.
  #
  # Inner comprehension: query-only params (rerank_k_strategy ×
  # pruning_strategy at fixed k=10, limit=50 in the bimodal-recall
  # zone). Each inner tuple is one query phase against the
  # just-built table.
  idx_sweep:
    # Outermost iter binds `profile` to `{fknn_profile}` so the
    # downstream `fknn_rampup_data` / `pvs_query_sweep` phases can
    # resolve `{dataset}:{profile}` in their `dataset_prebuffer(...)`
    # init-binding. Single-element iter — `fknn_profile` is a
    # workload param with a literal default.
    - for: "profile in {fknn_profile}"
      phases:
        # ── Hard reset ───────────────────────────────────────────
        #
        # Drop the whole keyspace BEFORE anything else. Wipes out
        # every table + every SAI index + every materialized view
        # in one statement, regardless of whether the names match
        # the current sweep's `fknn_oat_*` naming scheme. The
        # per-variant `teardown` loop below (and the per-cell
        # leading teardown inside the main sweep) only sees
        # CURRENT-scheme names; tables left from a prior sweep
        # with a different naming convention (`vec_label_*`,
        # `fknn_default_*`, old axis combinations) accumulate
        # otherwise and breach the cluster's 100-SAI-index cap.
        # `keyspace_reset` is O(1) statements and side-steps that
        # cap because DROP KEYSPACE evicts everything at once.
        - keyspace_reset

        # ── Main sweep ───────────────────────────────────────────
        #
        # `keyspace_reset` above wipes the entire keyspace, so
        # per-variant teardown is unnecessary — there's no
        # detritus from prior cells, prior axis combinations, or
        # crashed sessions to clean up. Each iter starts fresh
        # with `schema` against an empty keyspace.
        # OUTER comprehension: index-affecting params.
        #
        # Short iter-var names (`sm`, `mnc`, `bw`, `eh`, `nbo_v`,
        # `alf_v`) to avoid the unconditional iter-var/workload-
        # param name-collision rule. Parallel-iter form for the
        # float-valued knobs zips each value with its label
        # (`1.0 → "1p0"`) so the table name can use the label
        # while the workload-param shadow below uses the numeric
        # value.
        #
        # source_model values are the canonical UPPERCASE enum
        # spellings from cndb's `VectorSourceModel`. Cassandra
        # folds unquoted CQL identifiers to lowercase at parse
        # time, so a literal `{sm}` in the table-name expression
        # would silently mismatch the stored identifier whenever
        # we look the table up by JMX (`forceKeyspaceCompaction`
        # does a case-sensitive lookup → "Unknown keyspace/cf
        # pair"). The bindings: block below normalises via
        # `str_lower(sm)` to give the table-name expression a
        # lowercase wire (`sm_lc`) that matches the stored
        # identifier; the canonical uppercase `{sm}` still flows
        # into the CQL OPTIONS clause via the `set:` shadow.
        - for: |
            sm in sm_values,
            mnc in mnc_values,
            bw in bw_values,
            eh in eh_values,
             (nbo_v, nbo_label) in (concat(nbo_v_values), concat(nbo_label_values)),
             (alf_v, alf_label) in (concat(alf_v_values), concat(alf_label_values))
          order: extrema/1
          phases:
            # Per-iter case-fold of the source_model value so the
            # table-name expression below uses the same lowercase
            # form Cassandra stores. `str_lower` is the SRD-12
            # stdlib helper added for this kind of upstream
            # case-normalisation; the wire produced here lives
            # only for this outer iter's activation (its value
            # depends on the iter-var `sm`, so the cascade
            # discriminator declines to bake it into the cached
            # downstream phase program).
            - bindings: |
                const sm_lc := str_lower(sm)
              phases:
                # Table-name uses the short iter-var names + label
                # forms for the floats (`1.0 → "1p0"` via the
                # parallel-iter zip above), plus `sm_lc` from the
                # bindings block above. A single-element source so
                # the lifecycle phases close over `{table}`. Sits
                # ABOVE the `set:` so its source interpolation
                # sees the outer iter-vars `sm`/`mnc`/etc.
                # directly (`set:` would otherwise interpose a
                # scope boundary that hides them).
                - for: "table in fknn_oat_{sm_lc}_m{mnc}_bw{bw}_h{eh}_nbo{nbo_label}_a{alf_label}"
                  phases:
                    # `set:` shadows each workload-param with the
                    # iter-var's value. A bare `set:` value is a wire
                    # REFERENCE (consistent with comprehension r-values),
                    # so `set: { source_model: sm }` writes
                    # `const source_model := sm` and binds sm's current
                    # value; a string literal would need the explicit
                    # `'"…"'` form. Downstream `{source_model}` bind-points
                    # in the schema phase pick up the shadow at
                    # op-execution time.
                    - set: { source_model: sm,
                             maximum_node_connections: mnc,
                             construction_beam_width: bw,
                             enable_hierarchy: eh,
                             neighborhood_overflow: nbo_v,
                             alpha: alf_v }
                      phases:
                        # Table + index lifecycle — runs once per
                        # outer tuple. `keyspace_reset` at the top of
                        # the scenario already cleaned every prior
                        # variant's residue; per-cell leading
                        # teardown is redundant.
                        - schema
                        - fknn_rampup_data
                        # One-phase finalization (inherited from
                        # full_cql_vector.yaml via `extends:`):
                        # flush → read SSTable count → conditionally
                        # compact (daemon, `if: sstables > 1`,
                        # long-poll) → poll `system_views.sstable_tasks`
                        # until idle. Emits the `time_to_index`
                        # phase-duration gauge plus live compaction
                        # progress metrics.
                        - finalize_index
                        # INNER comprehension: query-only params.
                        # Reified value lists are workload params so
                        # operators can pin individual axes for
                        # diagnostic runs (`nmbrs run ...
                        # rerank_k_strategy_values=default
                        # pruning_strategy_values=default`). Iter-var
                        # names don't collide with any workload param,
                        # so the phase reads them directly via the
                        # scope chain — no `set:` needed.
                        - for: "rerank_k_strategy in {rerank_k_strategy_values},
                                pruning_strategy in {pruning_strategy_values},
                                k in {k_values},
                                limit in {limit_values}"
                          phases:
                            - pvs_query_sweep
                        # TRAILING teardown — drop the variant's
                        # No trailing teardown: `keyspace_reset`
                        # at scenario top is the only cleanup
                        # boundary the sweep needs. Per-cell drops
                        # would re-trigger the 100-SAI-index cap
                        # symptom they used to be a workaround for
                        # — but the cap was caused by ACCUMULATED
                        # residue from prior runs, which
                        # `keyspace_reset` now wipes once at the
                        # top. The cluster never sees more than 2
                        # indexes live at a time (the current
                        # cell's vector_idx + meta_idx).

phases:

  # ── New phase: pvs_query_sweep ───────────────────────────────
  #
  # Same shape as the parent's `pvs_query`, but the `ann_opts`
  # const reads two orthogonal strategy axes
  # (rerank_k_strategy × pruning_strategy) instead of the parent's
  # single `rerank_mode` flat enum. Composes a `WITH ann_options
  # = {...}` clause from two pieces or emits the empty string
  # when both axes are at their `_def` detent (`rerank_def` /
  # `pruning_def`).
  pvs_query_sweep:
    concurrency: "{query_concurrency}"
    errors: count
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const query_counts := query_count(prebuffered)
      cursor q = until_elapsed(query_counts, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % query_counts)
      predicate := predicate_value_at(prebuffered, q % query_counts)
      ground_truth := filtered_neighbor_indices_at(prebuffered, q % query_counts)

      # ── Per-query ann_options clause assembly ───────────────
      # `select_str` is binary (cond, then, else); nesting picks
      # the rerank_k value for the current rerank_k_strategy.
      # `rerank_def` produces an empty string (no rerank_k key);
      # any other value produces a `'rerank_k': '<N>'` fragment.
      # Detent names use the `rerank_<descriptor>` prefix so
      # they read cleanly as facet labels in the plots and tables.
      const rerank_k_part := select_str(str_eq(rerank_k_strategy, "rerank_def"), "",
                             select_str(str_eq(rerank_k_strategy, "rerank_lim"),
                                        str_concat("'rerank_k': '", format_u64(limit, 10), "'"),
                             select_str(str_eq(rerank_k_strategy, "rerank_2x"),
                                        str_concat("'rerank_k': '", format_u64(2 * limit, 10), "'"),
                             select_str(str_eq(rerank_k_strategy, "rerank_4x"),
                                        str_concat("'rerank_k': '", format_u64(4 * limit, 10), "'"),
                                        "'rerank_k': '1000'"))))
      # pruning fragment. `pruning_def` → no key; `pruning_off`
      # / `pruning_on` set the JVECTOR_USE_PRUNING toggle
      # explicitly. Detent names share the `pruning_<state>`
      # prefix so they sort and read cleanly in charts.
      const pruning_part := select_str(str_eq(pruning_strategy, "pruning_off"), "'use_pruning': 'false'",
                            select_str(str_eq(pruning_strategy, "pruning_on"),  "'use_pruning': 'true'",
                                                                                 ""))
      # Stitch. Comma-join when both fragments are non-empty,
      # otherwise emit whichever is present, otherwise an empty
      # opts body.
      const have_rerank  := str_ne(rerank_k_part, "")
      const have_pruning := str_ne(pruning_part, "")
      const opts_body := select_str(have_rerank,
                          select_str(have_pruning,
                                     str_concat(rerank_k_part, ", ", pruning_part),
                                     rerank_k_part),
                          select_str(have_pruning, pruning_part, ""))
      const ann_opts := select_str(str_eq(opts_body, ""), "",
                                   str_concat("WITH ann_options = {", opts_body, "}"))

    ops:
      select_ann:
        prepared: |
          SELECT key,value FROM {keyspace}.{table}
          WHERE metadata = {predicate:*}
          ORDER BY value
          ANN OF {query_vector} LIMIT {limit}
          {ann_opts}
        metrics:
          rows_per_op:
            kind: gauge
            value: count
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: k
            r: limit
            functions:
              - recall
