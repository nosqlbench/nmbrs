[package]
name = "nmbrs-adapter-stdout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stdout adapter for nmbrs: writes assembled ops to stdout or a file"
keywords = ["nosqlbench", "workload", "benchmark", "stdout"]
categories = ["command-line-utilities", "simulation"]
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
nmbrs-runtime = { path = "../../nmbrs-runtime", version = "0.1.2" }
nmbrs-workload = { path = "../../nmbrs-workload", version = "0.1.2" }
inventory = "0.3.24"
# `ParsedOp.params` is `HashMap<String, serde_json::Value>`; the
# adapter needs the type to read its per-op-template `stdout:`
# channel param (SRD-40b §9). Workspace-wide pin would be ideal,
# but the workload crate already pulls serde_json transitively.
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
polydat = "0.3"
