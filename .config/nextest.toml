# Nextest configuration (SRD-less; operational only).
#
# Why nextest here at all: cargo's libtest runner executes test BINARIES
# sequentially, so workspace wall time is the SUM of suite times (~120s, of
# which three example-sweep suites are 69%). Nextest schedules per-test
# across binaries, so wall time compresses toward the longest individual
# tests instead.

[profile.default]
# One failing test should not hide the rest of the picture — mirrors the
# --no-fail-fast habit this workspace already needed (a cassandra-cpp
# timeout used to truncate the run and report `passed=13`).
fail-fast = false

# Long example sweeps are legitimate; say so instead of killing them.
# (Warn at 60s, but never terminate: period without terminate-after only
# reports.)
slow-timeout = { period = "60s" }

# The PTY tests each allocate a pseudo-terminal plus an `nmbrs` child.
# Under nextest's one-process-per-test fan-out the concurrent PTY
# allocations starve each other and the emulator's render loop stalls, so
# those binaries share a single-slot group: one PTY test at a time, still
# overlapped with the rest of the suite. Every binary that uses
# `tests/pty_support` belongs in the filter below.
[test-groups]
pty = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(op_leaf_display) | binary(output_channel_harness) | binary(plotter_alignment) | binary(readout_pipeline) | binary(srd92_display) | binary(tui_display_harness) | binary(tui_terminal_toggle)'
test-group = 'pty'
