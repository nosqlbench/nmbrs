#
# Build (and on tag pushes, publish) nmbrs release artifacts.
#
#   build-artifact — 3-way matrix producing bare per-platform
#     binaries, every one built with `--features all-engines`
#     (pure-Rust scylla + cassandra-cpp via FFI). All runners are
#     native (no QEMU emulation):
#       linux/amd64   → ubuntu-24.04        + apt deps
#       linux/arm64   → ubuntu-24.04-arm    + apt deps
#       macos/arm64   → macos-14            + brew deps
#     Each entry calls `bash crates/nmbrs-adapter-cql/build.sh driver`
#     (DRIVER_BUILD_MODE=native) so the driver recipe stays
#     single-source with the local docker path.
#
#   build-image-arch / build-image-merge — multi-arch
#     (linux/amd64+linux/arm64) docker image. Per-arch tarballs
#     transit through a run-scoped GHA cache slot; merge job
#     stages them in a workflow-local registry:2 service and
#     creates the manifest list. Pushed to GHCR on tag refs only.
#
#   release — fires only on `v*` tag pushes. Downloads each
#     per-target binary artifact, renames it to include the
#     target triple, generates SHA256SUMS, and attaches the
#     binaries to a GitHub Release. Release-asset downloads are
#     served unwrapped, unlike workflow-artifact downloads which
#     GHA always wraps in a zip at the web UI.
#
# Two platforms intentionally NOT in the matrix:
#
# - Windows (`x86_64-pc-windows-msvc`): upstream `cassandra-cpp-sys`
#   has no Windows support. Revisit when upstream adds MSVC
#   support or we decide to fork the -sys crate.
#
# - Intel macOS (`x86_64-apple-darwin` / macos-13): GHA's last
#   Intel mac runner pool is heavily contended; queue times
#   routinely exceed an hour. Apple Silicon dominates the macOS
#   install base today; Intel users build from source.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cassandra_cpp_driver_ref:
        description: 'apache/cassandra-cpp-driver git ref (branch or tag)'
        type: string
        default: '2.17.1'

env:
  # Pinned ref so docker layer cache + sysroot cache are stable
  # across runs. Override at dispatch time if needed.
  CASSANDRA_CPP_DRIVER_REF: ${{ github.event.inputs.cassandra_cpp_driver_ref || '2.17.1' }}
  # Every JS-based action below is pinned to a major version that
  # natively targets Node 24 — no `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24`
  # shim needed. If a bump regresses (action removed an input,
  # changed semantics), pin back to the previous major and reopen
  # the upgrade as its own change.

jobs:
  # ─── Architecture gate: the crate/module dependency rules
  # (docs/SRD/05_dependency_rules.md, Pillar 5 of the Subsystem
  # Treatment Standard). Fast, default-features only (no cassandra
  # sysroot), runs on every push/PR so layering drift fails CI.
  arch-gate:
    name: architecture rules gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config mold clang libssl-dev ca-certificates

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-gate

      - name: Run dependency-rule gate (SRD-05)
        run: cargo test -p nmbrs --test architecture_rules

  build-artifact:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not stop the others — release
      # readiness wants the full per-platform signal.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os:     linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os:     linux
          - target: aarch64-apple-darwin
            runner: macos-14            # Apple Silicon (M-series)
            os:     macos
          # Intel macOS (x86_64-apple-darwin / macos-13) is
          # intentionally omitted: GHA's last Intel mac runner
          # pool is heavily contended and queue times routinely
          # exceed an hour. Apple Silicon now dominates the
          # macOS install base; Intel users build from source.
    steps:
      - uses: actions/checkout@v6

      # ─── Linux deps: C++ driver build + workspace linker
      # (mold/clang per .cargo/config.toml).
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git \
            libuv1-dev libssl-dev zlib1g-dev \
            pkg-config mold clang ca-certificates

      # ─── macOS deps: cmake/libuv/openssl@3 via Homebrew.
      # openssl@3 is keg-only; `_build_driver_native` will pick
      # the right PKG_CONFIG_PATH + OPENSSL_ROOT_DIR.
      # Skip `brew install` when the formula is already present —
      # otherwise brew emits "already installed and up-to-date"
      # warnings that GHA flags on the run summary.
      - name: Install macOS build dependencies
        if: matrix.os == 'macos'
        run: |
          for pkg in cmake libuv openssl@3 pkg-config; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      # ─── Cache the libcassandra static archive + header.
      # Keyed on driver ref + target triple + recipe-source hashes
      # so any drift invalidates the cache.
      - name: Cache cassandra-cpp-driver sysroot
        id: cache-sysroot
        uses: actions/cache@v5
        with:
          path: crates/nmbrs-adapter-cql/target/sysroot
          key: cass-cpp-${{ env.CASSANDRA_CPP_DRIVER_REF }}-${{ matrix.target }}-${{ hashFiles('crates/nmbrs-adapter-cql/build.sh', 'crates/nmbrs-adapter-cql/cassandra-cpp-driver.Dockerfile') }}

      - name: Build cassandra-cpp-driver (native mode)
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        env:
          DRIVER_BUILD_MODE: native
          CASSANDRA_CPP_DRIVER_VERSION: ${{ env.CASSANDRA_CPP_DRIVER_REF }}
        run: bash crates/nmbrs-adapter-cql/build.sh driver

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nmbrs-${{ matrix.target }}

      # ─── Build nmbrs with all-engines for every platform.
      # On macOS we want a single self-contained binary — same
      # shape as Linux. cassandra-cpp-sys forces dynamic-link
      # directives (`dylib=crypto/ssl/uv`), but ld64 picks .dylib
      # over .a only WITHIN a search path. By staging .a archives
      # in our sysroot (which contains no .dylib) and listing it
      # FIRST in CASSANDRA_SYS_LIB_PATH, the linker resolves
      # -lcrypto/-lssl/-luv against the static archives before
      # ever reaching brew's dual-format paths.
      - name: Build nmbrs (all-engines)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            sysroot="$PWD/crates/nmbrs-adapter-cql/target/sysroot/lib"
            # -f: the sysroot cache restores these .a files with brew's
            # read-only mode; plain cp can't overwrite them on a cache hit.
            cp -f "$(brew --prefix openssl@3)/lib/libcrypto.a" "$sysroot/"
            cp -f "$(brew --prefix openssl@3)/lib/libssl.a"    "$sysroot/"
            cp -f "$(brew --prefix libuv)/lib/libuv.a"         "$sysroot/"
            # Brew paths kept as fallback in case any transitive
            # dep we haven't anticipated still needs dynamic resolve.
            uv="$(brew --prefix libuv)/lib"
            ssl="$(brew --prefix openssl@3)/lib"
            export CASSANDRA_SYS_LIB_PATH="$sysroot;$uv;$ssl"
          fi
          cargo build --release -p nmbrs \
            --target ${{ matrix.target }} \
            --no-default-features --features all-engines

      # ─── Assert the binary doesn't depend on any non-system
      # dynamic library. On Linux: libcassandra must be static
      # (libuv/libssl are standard at known system paths and fine
      # to keep dynamic). On macOS: in addition to the libcassandra
      # static check, the binary must not reference any
      # /opt/homebrew or /usr/local/Cellar paths — those won't
      # exist on user Macs without homebrew. ld64 picks .a over
      # .dylib when the sysroot search path has only the static
      # archives, which is what the build step above arranges.
      - name: Verify static link posture
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nmbrs"
          file "$bin"
          case "${{ matrix.os }}" in
            linux) deps="$(ldd "$bin" || true)" ;;
            macos) deps="$(otool -L "$bin" || true)" ;;
          esac
          echo "$deps"
          if echo "$deps" | grep -q libcassandra; then
            echo "FAIL: libcassandra is dynamically linked"
            exit 1
          fi
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            if echo "$deps" | grep -E '/opt/homebrew|/usr/local/Cellar|/usr/local/opt'; then
              echo "FAIL: binary has brew-pathed dylib deps; would not run on a Mac without brew"
              exit 1
            fi
          fi
          echo "OK: only system dynamic libs"

      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/nmbrs --version

      # Single-file upload: upload-artifact@v4 flattens to the
      # basename when given one file (rootDirectory becomes the
      # file's parent), so the artifact zip contains just `nmbrs`
      # — no nested target/release dirs and no tarball layer.
      # GHA still wraps every downloaded artifact in a zip at the
      # web UI; that's a platform behavior we can't disable.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: nmbrs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nmbrs
          if-no-files-found: error
          retention-days: 14

  # ───────────────────────────────────────────────────────────
  # Multi-arch docker image. Two stages:
  #
  #   build-image-arch  — matrix across native arch runners. Each
  #     entry builds the single-arch image, exports it to a
  #     Docker-format tarball, and saves the tarball to GHA cache
  #     under a `${run_id}`-scoped key. No GHCR pushes here.
  #
  #   build-image-merge — restores both tarballs from the
  #     run-scoped cache, stages them in a workflow-local
  #     `registry:2` service container, then on tag refs uses
  #     `docker buildx imagetools create` to copy layers from
  #     localhost:5000 to GHCR and write the multi-arch manifest
  #     list. Skipped entirely for non-tag refs (cleanup runs
  #     either way so the run-scoped cache entries don't linger).
  #
  # Why GHA cache and not artifacts: artifacts persist for the
  # configured retention (≥1 day, billable storage). Run-id-keyed
  # cache slots are unreachable from any other run, get LRU-
  # evicted from the 10 GB repo cache, and the cleanup step at
  # the end of the merge job removes them eagerly.
  # ───────────────────────────────────────────────────────────

  build-image-arch:
    name: image build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:     amd64
            platform: linux/amd64
            runner:   ubuntu-24.04
          - arch:     arm64
            platform: linux/arm64
            runner:   ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the single-arch image to a Docker-format tarball.
      # Layer cache (`type=gha,scope=...`) persists across runs
      # for incremental builds; the tarball itself is written
      # to /tmp and handed to the next step.
      - name: Build per-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/nmbrs-adapter-cql/nmbrs-cassandra-cpp.Dockerfile
          platforms: ${{ matrix.platform }}
          tags: nmbrs:${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      # Save the tarball to a run-scoped cache slot so the merge
      # job (running on a different runner) can pick it up.
      - name: Save tarball to run-scoped cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/image-${{ matrix.arch }}.tar
          key: nmbrs-image-tarball-${{ matrix.arch }}-${{ github.run_id }}

  build-image-merge:
    name: image manifest + push
    runs-on: ubuntu-24.04
    needs: build-image-arch
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      # Needed for the run-scoped GHA cache cleanup step
      # (DELETE /repos/{repo}/actions/caches?key=…).
      actions: write
    # Workflow-local Docker registry. Per-arch images are pushed
    # to localhost:5000 so `docker buildx imagetools create` has
    # registry references to assemble into a manifest list. The
    # service container is gone the moment this job ends.
    services:
      registry:
        image: registry:2
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore amd64 tarball
        uses: actions/cache/restore@v5
        with:
          path: /tmp/image-amd64.tar
          key: nmbrs-image-tarball-amd64-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore arm64 tarball
        uses: actions/cache/restore@v5
        with:
          path: /tmp/image-arm64.tar
          key: nmbrs-image-tarball-arm64-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Load tarballs + stage in workflow-local registry
        shell: bash
        run: |
          set -euo pipefail
          docker load -i /tmp/image-amd64.tar
          docker load -i /tmp/image-arm64.tar
          docker tag nmbrs:amd64 localhost:5000/nmbrs:amd64
          docker tag nmbrs:arm64 localhost:5000/nmbrs:arm64
          docker push localhost:5000/nmbrs:amd64
          docker push localhost:5000/nmbrs:arm64

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nmbrs
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=nmbrs
            org.opencontainers.image.description=Rust rewrite of nosqlbench — workload generation and benchmarking engine

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copies layers from localhost:5000 to GHCR while
      # assembling the manifest list. Source images and the
      # workflow-local registry vanish when the job ends; only
      # the final tagged manifest list lands in GHCR.
      - name: Create + push multi-arch manifest list to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args="$tag_args -t $tag"
          done <<EOF
          ${{ steps.meta.outputs.tags }}
          EOF
          docker buildx imagetools create $tag_args \
            localhost:5000/nmbrs:amd64 \
            localhost:5000/nmbrs:arm64

      # Always clean up the run-scoped cache entries so they
      # don't sit consuming repo cache quota until LRU eviction.
      # Best-effort: ignore failures (cache may already be gone
      # if the workflow was cancelled).
      - name: Delete run-scoped tarball caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for arch in amd64 arm64; do
            gh api -X DELETE \
              "/repos/${{ github.repository }}/actions/caches?key=nmbrs-image-tarball-$arch-${{ github.run_id }}" \
              || true
          done

  # ───────────────────────────────────────────────────────────
  # GitHub Release — only on `v*` tag refs. Downloads each
  # per-target binary artifact, renames each to include the
  # target triple, generates a SHA256SUMS file, and attaches
  # everything as Release assets (which the GitHub UI serves
  # without zip wrapping — unlike workflow artifacts). Auto-
  # generated changelog from commits since the previous tag.
  # Tags containing `-` (e.g. `v1.0.0-rc1`) get marked
  # `prerelease=true` automatically.
  # ───────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-artifact, build-image-merge]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download per-target binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nmbrs-*

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/nmbrs-*; do
            target="${dir##*/nmbrs-}"
            cp "$dir/nmbrs" "release/nmbrs-$target"
            chmod +x "release/nmbrs-$target"
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          ## Binaries

          Single-binary release per platform — no archive, no install step.

          | Platform | Asset |
          | --- | --- |
          | Linux amd64 | \`nmbrs-x86_64-unknown-linux-gnu\` |
          | Linux arm64 | \`nmbrs-aarch64-unknown-linux-gnu\` |
          | macOS Apple Silicon | \`nmbrs-aarch64-apple-darwin\` |

          Verify with \`SHA256SUMS\`.

          ## Docker image

          \`\`\`
          docker pull ghcr.io/$OWNER/nmbrs:$TAG
          \`\`\`

          Multi-arch manifest covering linux/amd64 + linux/arm64.

          ## Changes

          EOF
          # Append GitHub's auto-generated changelog (commits +
          # PRs since the previous tag).
          gh api "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body >> "$notes_file"

          prerelease_flag=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --notes-file "$notes_file" "${prerelease_flag[@]}"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "$TAG" \
              --notes-file "$notes_file" "${prerelease_flag[@]}"
          fi

          # --clobber overwrites assets with the same name, so
          # the step is idempotent across retries.
          gh release upload "$TAG" --repo "$REPO" release/* --clobber
