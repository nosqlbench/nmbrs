[package]
name = "nmbrs-metricsql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MetricsQL parser/evaluator (Rust port). Compatibility-tested against VictoriaMetrics' upstream test suite."
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SRD-86 §"The metric-reader surface": nmbrs-metrics is the foundational
# data-access library. The engine evaluates over its `queryapi` service
# (the `Vector` result shape, `MetricAccess`, selector matching) and
# owns no result types of its own. metricsql sits ABOVE metrics now —
# it is no longer a standalone leaf, by design.
nmbrs-metrics = { path = "../nmbrs-metrics", version = "0.1.0" }
# HDR histogram for the holistic-class streaming reducers
# (`quantile_over_time` and friends). Mergeable sketch with
# bounded relative error — see SRD-47 §"Holistic-function
# policy" for the design choice.
hdrhistogram = "7"
# Continuous-query runtime (SRD-48). Actor + ArcSwap pattern
# mirrors the SRD-40 cadence_reporter shape exactly.
crossbeam-channel = { version = "0.5", optional = true }
arc-swap = { version = "1", optional = true }
# SRD-86 — the `metricsql_*` polydat node family (parse + evaluate +
# project a query result to a polydat `Value`). Optional so the engine
# stays polydat-free for consumers that only want parse/evaluate.
polydat = { version = "0.3", optional = true }
inventory = { version = "0.3.24", optional = true }

[features]
default = []
# Enables `nmbrs_metricsql::runtime::ContinuousQueryRuntime` —
# the orchestration layer over `StreamingPlan`. See SRD-48.
runtime = ["dep:crossbeam-channel", "dep:arc-swap"]
# Enables the `metricsql_*` polydat node family + the Vector→Value
# projector (SRD-86 §"The metric-reader surface").
polydat-nodes = ["dep:polydat", "dep:inventory"]

[dev-dependencies]
# Test fixtures harvested from upstream VM tests live in
# tests/fixtures/*.json — loaded by integration tests.
# rusqlite builds fresh schemas for the sqlite-backend integration
# test (tests/sqlite.rs); nmbrs-metrics with its `sqlite` feature
# provides the backend itself (the engine sits over it).
rusqlite = { version = "0.31", features = ["bundled"] }
nmbrs-metrics = { path = "../nmbrs-metrics", version = "0.1.2", features = ["sqlite"] }
# A live `CadenceReporter` owner is a `tokio::spawn` task, so the
# backend-parity integration test (tests/sqlite.rs) runs under a
# multi-thread runtime.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
