[package]
name = "nmbrs-optimizers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone, runtime-free black-box (derivative-free) optimization library for nmbrs (SRD-86)"
keywords = ["nosqlbench", "optimization", "black-box", "derivative-free", "benchmark"]
categories = ["algorithms", "science", "simulation"]
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
# The algorithm core is dependency-free (SRD-86 A2) — it depends on no nmbrs
# runtime crate, no polydat, no metrics — so every optimizer is unit-testable
# against synthetic manifold models with zero runtime, and the subsystem
# stays independently extractable. The optional `runtime` feature adds ONLY
# the inventory bridge (`src/bridge.rs`) that registers these optimizers
# against the core `nmbrs-runtime` contract; the algorithms never touch it.
nmbrs-runtime = { path = "../nmbrs-runtime", version = "0.2.1", optional = true }
inventory = { version = "0.3.24", optional = true }

[features]
# Off by default: the default build is the standalone algorithm library.
runtime = ["dep:nmbrs-runtime", "dep:inventory"]
