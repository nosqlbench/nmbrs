# Default to release builds via aliases.
# `cargo t` = `cargo test --release`
# `cargo b` = `cargo build --release`
[alias]
t = "test --release"
b = "build --release"
in = "install --path crates/nmbrs"

# Direct all test temp files to target/test-tmp/ instead of /tmp.
[env]
TMPDIR = { value = "target/test-tmp", relative = true }
# Widen the example-workload sweep's in-process concurrency for workspace
# test runs. The sweep (crates/nmbrs/tests/example_workloads_in_process.rs) reads
# this and defaults to 10; this box has 64 cores and the examples are
# grouped for serial isolation where they need it, so the cap — not the
# work — was the wall time. `force = false` (default): an explicit
# NMBRS_TEST_CONCURRENCY in the environment still wins.
NMBRS_TEST_CONCURRENCY = "24"
# Linker search path for the vendored libcassandra static
# archive. Built once via `bash crates/nmbrs-adapter-cql/build.sh driver`
# — Docker pulls the C++ driver source, builds, extracts to
# crates/nmbrs-adapter-cql/target/sysroot/lib. With these in scope every
# workspace build — including `cargo test --workspace`, which
# pulls in vendor/cassandra-cpp's tests/examples — finds
# `-lcassandra` without the developer needing build.sh's env
# exports. `relative = true` resolves against the workspace
# root. `force = false` (default) preserves any existing
# user setting, so a host-installed libcassandra still wins.
LIBRARY_PATH = { value = "crates/nmbrs-adapter-cql/target/sysroot/lib", relative = true }
C_INCLUDE_PATH = { value = "crates/nmbrs-adapter-cql/target/sysroot/include", relative = true }
# The cassandra-cpp-sys build.rs reads these to emit
# `cargo:rustc-link-search=native=…` and to point bindgen
# at the headers.
CASSANDRA_SYS_LIB_PATH = { value = "crates/nmbrs-adapter-cql/target/sysroot/lib", relative = true }
CASSANDRA_SYS_INCLUDE_PATH = { value = "crates/nmbrs-adapter-cql/target/sysroot/include", relative = true }

# Use mold linker for final binaries — dramatically faster than ld for
# large binaries (~350 MB debug). mold parallelizes across all cores.
#
# `force-frame-pointers=yes` keeps `rbp` reserved as the frame-pointer
# register on x86_64. `nmbrs-runtime::profiler` defaults to
# `perf record --call-graph fp` (set via `profiler=perf` on the CLI);
# without this flag, perf would have to fall back to DWARF call-graphs
# whose post-processing routes through `addr2line` and is 5–10× slower
# at flamegraph generation. Cost: one register reserved across the
# binary — negligible for the workload-driver path. The tradeoff is
# documented in `nmbrs-runtime::profiler` next to the call-graph
# selection logic.
# Linux (x86_64 + aarch64): clang + mold + frame pointers + -lz.
# Splitting by triple would force the CI matrix to keep two
# identical blocks in sync; the `cfg(...)` form covers both ubuntu
# runners with one source of truth.
#
# `-lz` covers zlib symbols (`inflateInit2_`, …) that
# `libcassandra_static.a` references but the upstream
# `cassandra-cpp-sys` build.rs doesn't declare. With
# `-Wl,--as-needed` (mold's default) zlib drops out of binaries
# that don't actually use it, so adding it globally is free for
# non-cassandra builds and lets `cargo test --workspace` link the
# vendor/cassandra-cpp test bins against the sysroot prepared by
# `bash crates/nmbrs-adapter-cql/build.sh driver`.
[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=-lz",
]

# macOS (aarch64 + x86_64): system ld64 (mold is Linux-only) +
# frame pointers + -lz (same libcassandra_static.a zlib reference
# as on Linux; libz lives in the macOS SDK so the system linker
# resolves -lz directly).
[target.'cfg(target_os = "macos")']
rustflags = [
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=-lz",
]

[profile.dev]
# Split debuginfo into separate files — smaller binary, faster link.
split-debuginfo = "unpacked"
# Optimize dependencies but not workspace crates (fast recompile of our code).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Line tables only — keeps symbol names + line numbers in the
# release binary so `profiler=perf` flamegraphs resolve `[nmbrs]`
# frames to real function names without the 4× binary-size
# blowup of full DWARF (`debug = 2`).
debug = 1
