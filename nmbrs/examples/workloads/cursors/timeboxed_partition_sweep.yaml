#
# timeboxed_partition_sweep.yaml — partition-bound open-extent
# cursors (SRD 71 §"Interaction with existing cursor surface").
#
# ── The problem this composition solves ───────────────────────
#
# You want to walk a large domain slice by slice, giving every
# slice the same time budget, with two guarantees:
#
#   1. A slice SMALLER than the budget finishes the moment it is
#      exhausted — it never wraps around and re-reads rows, and
#      it never idles out the rest of its budget.
#   2. A slice BIGGER than the budget stops on time — it never
#      starves the slices after it.
#
# Neither cursor form gives you this alone. `range(...) over p`
# covers the slice exactly but has no time bound; a bare
# `until_elapsed(base, min_ms)` honours the budget but walks an
# open extent with no respect for slice boundaries. The
# composition `until_elapsed(base, min_ms) over p` is the whole
# point: the cursor walks base-sized chunks *inside* the
# partition, the time policy keeps making its usual decisions,
# and the partition end is a hard cap — whichever comes first
# wins.
#
# ── What this example does ────────────────────────────────────
#
# The domain is 5000 rows, sliced `20,30,*` (operator-overridable
# via `slices=`): two small lead-in slices, then the remainder.
# Each slice gets a 1-second budget, paced at ~200 rows/s:
#
#   slice 0  [   0,   20)  →  20 rows ≈ 0.1s — exhausted early
#   slice 1  [  20,   50)  →  30 rows ≈ 0.15s — exhausted early
#   slice 2  [  50, 5000)  →  4950 rows would take ~25s; the
#                             budget cuts it off after ~1s
#                             (~200 rows visited, none repeated)
#
# Every visited row prints once, tagged with the live slice
# window read through the `q.cursor.*` scalar projections, so
# the output makes the boundary behaviour visible: rows stay
# strictly inside each window, the small windows complete, and
# the big window's coverage is whatever the budget allowed.
#
# Swap the stdout adapter for a real driver and `row` becomes
# your key ordinal: "smoke-test every tenant slice for at most a
# second each" or "give each shard a fixed re-validation window"
# are this exact shape.

params:
  # Slice layout, relative to the 5000-row domain. Operators can
  # reshape the sweep without touching the workload:
  #   slices=linear:10          ten equal windows
  #   slices=10%,~80%,10%       head and tail only, skip the middle
  #   slices=*/16 random        sixteen windows, shuffled order
  slices: "20,30,*"

scenarios:
  default:
    - for: "p in partitions(\"{slices}\", 5000)"
      phases: [timeboxed_slice]

phases:
  timeboxed_slice:
    concurrency: 1
    # Pace the walk so the time budget is meaningful — without a
    # rate the stdout adapter would blast through every slice
    # before the clock mattered.
    rate: 200
    bindings: |
      cursor q = until_elapsed(50, 1000) over p
      row := q
    ops:
      visit:
        adapter: stdout
        stmt: "slice {q.cursor.idx}/{q.cursor.partition_count} window=[{q.cursor.start_ordinal}..{q.cursor.end_ordinal}) row={row}"

