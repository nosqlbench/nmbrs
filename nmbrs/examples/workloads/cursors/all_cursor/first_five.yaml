#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# all(<cursor>) + order/truncate — enumerate a cursor's leading slice.
#
# The `all(row)` named generator composes with an `order` clause and
# a truncation count: `for: "xval in all(row) order lex/5"` takes the
# first five ordinals in lexical order. Over `range(0, 50)` that is
# {0, 1, 2, 3, 4} — five iterations of the inner phase.

bindings: |
  cursor row = range(0, 50)

scenarios:
  default:
    # `order` is a sibling field of `for:` — `lex/5` traverses in
    # lexical order and truncates to the first five tuples.
    - for: "xval in all(row)"
      order: "lex/5"
      phases: [print]

phases:
  print:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      info:
        stmt: "xval={xval}"

