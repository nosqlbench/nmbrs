#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# all(<cursor>) — enumerate a cursor's full extent.
#
# The scenario-level `for: "xval in all(row)"` comprehension reads
# the cursor's resolved extent (50) and iterates `xval` over the
# whole range [0, 50). Each iteration runs the inner `print` phase
# with `xval` bound to the next ordinal — the simple "run once per
# row of an N-row dataset" shape (SRD-18c §"Layer 3: Named
# generators").
#
# The cursor is declared at workload level so its extent auxiliaries
# are visible to the scenario-level comprehension. Swap `range(0, 50)`
# for a vectordata cursor sugar and the same `all(row)` form works
# unchanged.

bindings: |
  cursor row = range(0, 50)

scenarios:
  default:
    - for: "xval in all(row)"
      phases: [print]

phases:
  # `cycles: 1` overrides the cursor-extent cycle inference, so each
  # of the 50 outer iterations runs the phase exactly once.
  print:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      info:
        stmt: "xval={xval}"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
#@ expect 50 completed, 0 failed
