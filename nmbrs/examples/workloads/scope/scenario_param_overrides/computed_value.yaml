#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# Scenario-tree `set:` — computed (interpolated) value.
#
# The value goes through polydat's string-interpolation surface:
# `"mode_for_{size}"` desugars to `printf("mode_for_{}", size)` and is
# evaluated at scope-init once `size` is wired through the chain. With
# the workload-root `size=small`, the result is mode=mode_for_small.
# Output: set/mode_for_small/small.

params:
  mode: default
  size: small

scenarios:
  default:
    - set: { mode: "mode_for_{size}" }
      phases:
        - announce

phases:
  announce:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "set/{mode}/{size}"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
#@ expect set/mode_for_small/small
#@ expect 0 failed
