#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# Scenario-tree `set:` — multi-key shadow.
#
# Multiple key-value pairs in one `set:` map produce sibling `const`
# lines in one source body, declaration order determining shadowing on
# collision. Both `mode` and `size` are overridden together.
# Output: set/verbose/bulk.

params:
  mode: default
  size: small

scenarios:
  default:
    - set: { mode: '"verbose"', size: '"bulk"' }
      phases:
        - announce

phases:
  announce:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "set/{mode}/{size}"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
#@ expect set/verbose/bulk
#@ expect 0 failed
