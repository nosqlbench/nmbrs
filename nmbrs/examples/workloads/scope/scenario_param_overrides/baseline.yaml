#
# Scenario-tree `set:` — baseline (no shadowing).
#
# With no scenario-tree binding in play, the `announce` op-template
# resolves the workload-root params directly: mode=default, size=small.
# This is the reference point the sibling demos shadow against:
#   single_shadow, multi_shadow, computed_value, with_for_each,
#   nested, long_form.

params:
  mode: default
  size: small

scenarios:
  default:
    - announce

phases:
  announce:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "set/{mode}/{size}"

