#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# Scenario-tree `set:` — single-key shadow.
#
# `set: { mode: '"verbose"' }` publishes a scope-local `const mode`
# over the inner `phases:` subtree; `size` keeps its workload-root
# default. Output: set/verbose/small.
#
# Quoting note: the YAML single-quotes around polydat double-quotes
# (`'"verbose"'`) survive YAML scalar parsing and reach polydat as a
# string literal. A bare token (no quotes) would be read as a polydat
# wire reference instead — see ../scenario_set_iter_var for that shape.

params:
  mode: default
  size: small

scenarios:
  default:
    - set: { mode: '"verbose"' }
      phases:
        - announce

phases:
  announce:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "set/{mode}/{size}"

