#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# Long-form `bindings:` reading the iter-var as a bare identifier.
#
# Inside the `for_each: "sm in alpha, beta"` scope, a `bindings:` block
# binds `const mode := sm` — `sm` as a bare identifier is a polydat
# wire reference to the outer iter-var (no `{...}` interpolation).
# Output:
#   mode=alpha
#   mode=beta

params:
  mode: default

scenarios:
  default:
    - for_each: "sm in alpha, beta"
      phases:
        - bindings: |
            const mode := sm
          phases:
            - announce_mode

phases:
  announce_mode:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "mode={mode}"

