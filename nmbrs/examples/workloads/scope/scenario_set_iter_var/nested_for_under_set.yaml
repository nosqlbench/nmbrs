# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# Nested `for_each` inside a `set:` scope, inner source reads the
# outer iter-var.
#
# `set: { mode: "{sm}" }` shadows `mode` per outer iteration, and a
# further-nested `for_each: "table in fknn_{sm}"` resolves `{sm}`
# against the OUTER iter-var — the intervening `set:` scope does not
# occlude the parent for_each var. Output (four lines):
#   mode=alpha
#   table=fknn_alpha mode=alpha
#   mode=beta
#   table=fknn_beta mode=beta

params:
  mode: default

scenarios:
  default:
    - for_each: "sm in alpha, beta"
      phases:
        - set: { mode: "{sm}" }
          phases:
            - announce_mode
            - for_each: "table in fknn_{sm}"
              phases:
                - announce_table

phases:
  announce_mode:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "mode={mode}"

  announce_table:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "table={table} mode={mode}"

