#
# Iter-var passthrough — phase reads the iter-var directly.
#
# An outer `for_each: "sm in alpha, beta"` binds `sm`; the leaf phase
# reads `{sm}` directly with no `set:` shadow, so `mode` keeps its
# workload-param default. Output (one line per iteration):
#   mode=default sm=alpha
#   mode=default sm=beta

params:
  mode: default

scenarios:
  default:
    - for_each: "sm in alpha, beta"
      phases:
        - announce_mode_and_sm

phases:
  announce_mode_and_sm:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "mode={mode} sm={sm}"

