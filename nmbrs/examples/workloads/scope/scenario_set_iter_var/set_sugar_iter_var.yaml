# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# `set:` sugar reading the iter-var via `{iter-var}` text-template.
#
# The load-bearing pattern behind index-sweep workloads: an outer
# `for_each: "sm in alpha, beta"` binds `sm`, and `set: { mode: "{sm}" }`
# shadows the workload-param per-iteration using the iter-var. This is
# the sugar form of string_interp_iter_var_in_bindings. Output:
#   mode=alpha
#   mode=beta

params:
  mode: default

scenarios:
  default:
    - for_each: "sm in alpha, beta"
      phases:
        - set: { mode: "{sm}" }
          phases:
            - announce_mode

phases:
  announce_mode:
    adapter: stdout
    cycles: 1
    concurrency: 1
    ops:
      msg:
        stmt: "mode={mode}"

