#!/usr/bin/env nmbrs
# Daemon-phase scope levels (SRD-82 Part 6).
#
# A `daemon: true` phase runs CONCURRENTLY with its foreground siblings,
# OFF the foreground concurrency budget, and is STOPPED the moment those
# siblings finish. The scope a daemon is declared in therefore decides how
# long it lives — its stop condition is simply "the foreground of MY scope
# completed". So you choose a daemon's lifetime by choosing where to root
# it: nest it in a sub-scope (a `scenario:` include is its own scope) to
# bound it to a subset of the run, or declare it at the top to shadow the
# whole scenario.
#
# This runs TWO daemons at DIFFERENT levels against the testkit adapter
# (no database, no dataset — it runs standalone):
#
#   demo  (top scope)
#   ├─ heartbeat   ← DAEMON @ top scope: shadows setup + build + verify,
#   │                stops at the END of `demo`
#   ├─ setup
#   ├─ build  (sub-scope — a `scenario:` include)
#   │   ├─ probe   ← DAEMON @ build scope: shadows ingest + compact,
#   │   │            stops at the END of `build`, BEFORE `verify`
#   │   ├─ ingest
#   │   └─ compact
#   └─ verify      ← runs with `heartbeat` still ticking but `probe`
#                    already stopped
#
# The lifecycle order makes the two stop conditions visible: `probe`
# completes before `verify` starts (its build scope finished), while
# `heartbeat` outlives `verify` and stops LAST (its scope is the whole
# `demo`). Watch it three ways:
#   nmbrs run workload=nmbrs/examples/workloads/scope/daemon_scoping.yaml tui=on
#       → the live footer stacks the active phases (the daemon(s) + the
#         current foreground phase) and drops `probe` before `verify`.
#   nmbrs run ... ; nmbrs checkpoint show <session>
#       → the scope_enter/exit + phase events in execution order.
#
# Why a daemon's stop is scope-local: the executor's `run_scenario_body`
# creates ONE daemon-stop flag per scope, spawns that scope's daemon
# children onto a side JoinSet, runs the foreground, then latches the flag
# the instant the foreground drains. A `scenario:` include recurses into
# its own `run_scenario_body`, so `probe` gets `build`'s flag and
# `heartbeat` gets `demo`'s — independent boundaries, no shared lock.

params:
  adapter: testkit
  # Foreground phases pace at this rate so each takes ~0.5 s — long enough
  # for the daemons (10/s) to tick visibly alongside them.
  rate: "20"

scenarios:
  default:
    - scenario: demo

  # Top scope. `heartbeat` is the first child, so the scenario shell spawns
  # it in daemon mode; it shadows every following foreground sibling
  # (setup, the whole `build` sub-scope, verify) and stops only when `demo`
  # completes.
  demo:
    - heartbeat
    - setup
    - scenario: build
    - verify

  # Sub-scope. A `scenario:` include is its own scene-tree scope, so the
  # `probe` daemon declared here is bounded to THIS group's foreground
  # (ingest + compact) — it has stopped before `verify` runs in the parent
  # scope. This is the same shape used to keep a query-probe daemon off the
  # recall measurement in an incremental compaction sweep.
  build:
    - probe
    - ingest
    - compact

phases:
  # ── Daemons ──────────────────────────────────────────────────
  # 10 ticks/s, capped well above the foreground duration so the STOP is
  # the scope's `daemon_stop` (not cycle exhaustion) — the point of the
  # demo. testkit's `stmt:` always succeeds, so the daemon ends Completed.
  heartbeat:
    adapter: testkit
    daemon: true
    concurrency: 1
    rate: 10
    cycles: 200
    ops:
      beat:
        stmt: "SELECT 'heartbeat';"
        memo:
          after: "heartbeat — shadows the whole run (stops at demo's end)"

  probe:
    adapter: testkit
    daemon: true
    concurrency: 1
    rate: 10
    cycles: 200
    ops:
      sample:
        stmt: "SELECT 'probe';"
        memo:
          after: "probe — shadows build only (stops before verify)"

  # ── Foreground ───────────────────────────────────────────────
  setup:
    adapter: testkit
    concurrency: 1
    cycles: 10
    ops:
      prepare:
        stmt: "CREATE TABLE demo (id bigint PRIMARY KEY);"

  ingest:
    adapter: testkit
    concurrency: 1
    cycles: 10
    ops:
      write:
        stmt: "INSERT INTO demo (id) VALUES ({cycle});"

  compact:
    adapter: testkit
    concurrency: 1
    cycles: 10
    ops:
      merge:
        stmt: "SELECT 'compact';"

  verify:
    adapter: testkit
    concurrency: 1
    cycles: 10
    ops:
      check:
        stmt: "SELECT count(*) FROM demo;"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
# Runs standalone (testkit; no host/dataset). Both daemons must stop
# cleanly when their scope's foreground completes → the run completes with
# no failed phases. This is also the only regression guard for daemon
# stop-scoping, so keep it.
#@ run
#@ expect completed, 0 failed
