#!/usr/bin/env nmbrs
# Staged execution over structured data partitioned by intrinsic
# cardinality — the generic counterpart to the vector profile sweep
# (an incremental compaction sweep kept out of the public tree).
#
# `cardinality_tiers.jsonl` is a plain JSONL file whose records are
# grouped into size tiers of growing cardinality (xs=2, s=3, m=5, l=10
# records). This workload partitions the record space at those tier
# boundaries using the SAME cursor-partition machinery the vector sweep
# uses (SRD-71) and runs ONE STAGE per tier, touching only that tier's
# incremental `[start_of(p), end_of(p))` slice of records.
#
# It verifies that the partition comprehension + incremental ranges +
# staged execution generalize beyond the vector-native forms — here over
# generic JSONL, via `partitions(...)` + `jsonl_field(...)` instead of
# `profile_partitions(...)` + the vectordata accessors. The downstream
# machinery (the `for: "p in <partitions>"` comprehension, `start_of` /
# `end_of` / `idx_of`, and per-stage phases) is identical.
#
# Run from the repo root:
#   nmbrs run workload=nmbrs/examples/workloads/iteration/staged_cardinality_sweep.yaml
#
# Expected: 4 stages, printing the incremental record slice per tier —dwwwwwww
#   stage 0/4 [0..2)   ids 0,1     (tier xs)
#   stage 1/4 [2..5)   ids 2,3,4   (tier s)
#   stage 2/4 [5..10)  ids 5..9    (tier m)
#   stage 3/4 [10..20) ids 10..19  (tier l)
# and a `tier_cardinality` gauge per stage (2, 3, 5, 10).

description: |
  Staged execution over a JSONL file partitioned by intrinsic
  cardinality tiers. Exercises the cursor-partition machinery
  (`partitions` + `start_of` / `end_of` / `idx_of`) and per-stage phases
  over generic structured data, mirroring the vector profile sweep
  without any vector-native formats.

params:
  adapter: stdout
  # The data file's intrinsic per-tier cardinalities, as a delta-list
  # partition spec: xs=2, s=3, m=5, l=10 → cumulative cut points
  # 2, 5, 10, 20 (summing to `total`). Change the data file and this
  # spec together. (The file PATH itself is a compile-time const arg of
  # `jsonl_field`, so it is a literal in the bindings below, not a param.
  # The relative path `cardinality_tiers.jsonl` resolves against this
  # workload's own directory, like `extends:` does.)
  tier_sizes: "2,3,5,10"
  total: 20

scenarios:
  default:
    - scenario: staged

  # One stage per cardinality tier; each stage touches only its tier's
  # incremental slice of the record space.
  staged:
    - for: "p in partitions('{tier_sizes}', {total})"
      phases:
        - process_tier

phases:
  process_tier:
    concurrency: 1
    bindings: |
      # `p` is the active tier-partition. `[start_of(p), end_of(p))` is
      # this tier's incremental slice of the record space, so the cursor
      # ranges over exactly that slice — one cycle per record.
      # The cursor bounds this stage to exactly `cardinality(p)` cycles
      # (the tier's incremental size). The per-record ABSOLUTE ordinal is
      # `at(p, cycle)` = `start_of(p) + cycle`, so the stage reads the
      # tier's own slice `[start_of(p), end_of(p))` of the record space —
      # not `[0, size)`. (A cursor's value wire is the local index; the
      # absolute ordinal comes from the partition accessor.)
      cursor row = range(start_of(p), end_of(p))
      ord := at(p, cycle)
      # Partition scalars (this tier's position + bounds) as plain wires
      # for the op text — `p` is a Partition value, projected via the
      # stdlib accessors.
      pidx   := idx_of(p)
      pcount := count_of(p)
      pstart := start_of(p)
      pend   := end_of(p)
      id   := jsonl_field(ord, "cardinality_tiers.jsonl", "id")
      tier := jsonl_field(ord, "cardinality_tiers.jsonl", "tier")
      name := jsonl_field(ord, "cardinality_tiers.jsonl", "name")
    metrics:
      # Per-stage cardinality — this tier's size — reported per stage,
      # the structured-data analogue of the per-tier recall metric.
      tier_cardinality: { kind: gauge, value: "cardinality(p)" }
    ops:
      visit:
        stmt: "stage {pidx}/{pcount} [{pstart}..{pend}) ord={ord} id={id} tier={tier} name={name}"

# ─── example-walker test directives ───
#@ expect completed, 0 failed
