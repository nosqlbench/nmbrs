#!/usr/bin/env nmbrs
# structural_report_demo.yaml — SRD-109 structural reporting, end to end.
#
# This workload has NO `report:` block. Its report is SYNTHESIZED from
# two kinds of structural fixture:
#
#   key_metrics:            on a phase — `column: "agg(family)"`. The
#                           aggregate is MANDATORY (`rows: result_success`
#                           is a parse error naming the vocabulary:
#                           min, max, avg, last, first, median, stddev,
#                           sum, count; derived rate(F), span(), delta(F)).
#                           Designating metrics attaches the phase to the
#                           table row of its nearest enclosing anchor.
#   anchor: <view>          on a scenario sweep — one table row per
#                           iteration, keyed by the sweep's coordinate
#                           label. Views sharing a name must share
#                           coordinates.
#
# The synthesized report for THIS workload has four parts:
#
#   spine            one row per single-activation phase (`prepare`),
#                    over the SRD-91 contract columns (count=last,
#                    failures=last, wall=span, p99=max — declared in the
#                    instrument contract, not implied);
#   view_shard       one row per `shard` (the anchored outer sweep),
#                    carrying `load_shard`'s designations: delivered
#                    rows, throughput, tail latency, and the queue-depth
#                    gauge's mean/max;
#   view_probe       one row per `probe_round` (the anchored INNER
#                    sweep — a nested anchor resets the row altitude, so
#                    each round's row folds the rounds across shards
#                    through the designated aggregates);
#   "Not tabulated"  `cooldown` loops WITHOUT an anchor and WITHOUT
#                    designations, so no rows are synthesized for it and
#                    the spine says so explicitly. (Give it designations
#                    without an anchor and synthesis FAILS — the
#                    silent-flatten error — which is the SRD-109
#                    no-implied-aggregates rule doing its job.)
#
# See it without running anything:
#   nmbrs report synth --workload nmbrs/examples/workloads/reports/structural_report_demo.yaml
# Render it against a run of this workload (always under a sandbox
# --session-path; never from the project root):
#   nmbrs run workload=nmbrs/examples/workloads/reports/structural_report_demo.yaml \
#       --session-path /tmp/srd109/session
#   nmbrs report all --workload nmbrs/examples/workloads/reports/structural_report_demo.yaml \
#       --session /tmp/srd109/session
# A workload WITH an explicit `report:` block renders that block instead;
# `--synthesized` forces the synthesized form and `report synth` always
# dumps it — the affine mirror stays inspectable either way.

params:
  adapter: testkit
  rate: "100"
  # Finest SRD-42 cadence window. Time-derived designations — span(),
  # rate(F) — ride each durable sample's active-window bookkeeping
  # (`interval_ms`), whose resolution is this floor. Sub-second demo
  # phases need a sub-second floor to read crisply; leave it unset for
  # real workloads, whose phases dwarf the default 1s window.
  metrics_cadence: "100ms"

phases:

  # Single-activation phase: no designations needed — it rows the
  # spine through the SRD-91 outcome-instrument contract columns.
  prepare:
    concurrency: 1
    cycles: 20
    rate: "{rate}"
    ops:
      seed:
        stmt: "PREPARE;"

  # The measuring phase of the outer sweep. `queue_depth` is a
  # synthetic pressure gauge recorded at TWO stations (one instance
  # per op), so the same family reads differently under two
  # aggregates — the normal shape for a pressure signal:
  #   depth_avg  what the queues sat at (mean of last-written
  #              values, the SRD-42 LWW gauge contract);
  #   depth_max  the worst station.
  # `rows_per_s` is a derived measure: it rides the per-sample
  # active-window bookkeeping, so it is exact even though a phase
  # this short leaves a single durable sample behind.
  load_shard:
    concurrency: 1
    cycles: 40
    rate: "{rate}"
    key_metrics:
      rows: last(result_success)
      rows_per_s: rate(result_success)
      op_p99: max(result_success_p99)
      depth_avg: avg(queue_depth)
      depth_max: max(queue_depth)
    bindings: |
      input cycle: u64
      wire_depth := mod_wire(cycle, 5) + shard
      sink_depth := mod_wire(cycle, 3)
    ops:
      write:
        stmt: "LOAD shard cycle={cycle};"
        metrics:
          queue_depth: { kind: gauge, value: wire_depth }
      drain:
        stmt: "DRAIN shard cycle={cycle};"
        metrics:
          queue_depth: { kind: gauge, value: sink_depth }

  # The probe measured per round of the INNER sweep.
  probe:
    concurrency: 1
    cycles: 30
    rate: "{rate}"
    key_metrics:
      probes: last(result_success)
      probe_p99: max(result_success_p99)
    ops:
      q:
        stmt: "PROBE;"

  # Looped but neither anchored nor designated: appears only in the
  # spine's "Not tabulated" note. This is the honest default for a
  # phase nobody declared measurables for — never a silently
  # aggregated row.
  cooldown:
    concurrency: 1
    cycles: 2
    ops:
      c:
        stmt: "COOL;"

scenarios:
  default:
    - prepare
    # Outer anchor: one `view_shard` row per shard.
    - for: "shard in 1,2,3"
      anchor: shard
      phases:
        - load_shard
        # Inner anchor: `probe_round` rows. A nested anchor resets the
        # row altitude — probe's designations key by probe_round, and
        # the three shards' contributions to each round fold through
        # the designated aggregates (max stays max, last folds via the
        # outer aggregate of the same designation).
        - for: "probe_round in 1,2"
          anchor: probe
          phases:
            - probe
    # Looped UN-anchored, no designations: legal, and lands in the
    # spine's "Not tabulated" note rather than a silently aggregated
    # row. (Add designations here without an anchor and synthesis
    # fails with the silent-flatten error.)
    - for: "cool_pass in 1,2"
      phases:
        - cooldown

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
# prepare + 3×(load_shard + 2×probe) + 2×cooldown = 12 phases.
#@ run
#@ expect completed, 0 failed
