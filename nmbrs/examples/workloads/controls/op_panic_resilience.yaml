#!/usr/bin/env nmbrs
# Op-panic resilience — a panicking op must NOT kill its fiber.
# (Concurrency invariant: a phase's target fiber count is maintained
# IRRESPECTIVE of error handling.)
#
# This is the PANIC half of the error-coverage pair; the returned-error half
# is `error_rate_circuit_breaker.yaml`. The two exercise the two distinct
# failure modes an op can present:
#
#   1. returned `Err`  — the adapter returns `ExecutionError` (a CQL timeout,
#      an overload rejection). Handled inline: counted, error-policy applied,
#      the fiber moves to the next cycle. (circuit_breaker example, via
#      testkit `result-error-rate`.)
#   2. PANIC out of `execute` — an adapter/op unwinds (an FFI driver on a
#      broken connection, an `unwrap` on a malformed response). This example,
#      via testkit `result-panic-rate` (a first-class misbehaviour knob). The
#      fiber catches the unwind at its op boundary, synthesises a `panic` op
#      error, and routes it through the SAME error policy — so the fiber
#      SURVIVES (the policy decides continue/stop) and the panic is counted
#      like any other error. Without that catch each fiber would die on its
#      first panic and concurrency would decay panic-by-panic (the phase
#      stalls far short of its cycle count).
#
# `result-panic-rate: 0.02` panics ~2% of cycles (deterministic per cycle, on
# a stream independent of `result-error-rate`). With 4 fibers over 400 cycles
# that is ~8 panics spread across the fibers — `errors: ".*:warn,counter"`
# counts each and keeps running, so all 400 cycles complete and NO phase is
# marked failed. (A caught panic prints a one-line panic notice to stderr —
# that is the tolerated op unwinding, not a crash; the run continues.)
#
# Usage:
#   nmbrs run workload=nmbrs/examples/workloads/controls/op_panic_resilience.yaml

description: |
  Op-panic resilience: a panicking op is caught at the fiber boundary,
  counted as an error, and does not reduce the phase's concurrency — every
  fiber survives and the sweep runs to completion.

params:
  adapter: testkit
  # Count every error — INCLUDING a panicking op — and keep running. The
  # fiber is preserved regardless; the policy only decides fatal-or-not.
  errors: ".*:warn,counter"

phases:
  load:
    concurrency: 4
    cycles: 400
    rate: "2000"
    ops:
      step:
        stmt: "step {cycle}"
        # First-class testkit misbehaviour: unwind out of `execute` on ~2% of
        # cycles. The fiber-boundary catch must survive every one.
        result-panic-rate: 0.02
        result-panic-message: "synthetic op panic (broken connection)"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
# Standalone (testkit; no host/dataset). Panicking ops are caught + counted;
# every fiber survives, so the phase COMPLETES with no failed phases (op-level
# failures are counted, not fatal). If the fiber-boundary catch regressed, the
# fibers would die on their panics and the phase would stall — the dedicated
# cycle-count assertion in nmbrs-runtime/tests guards that precisely.
#@ run
#@ expect completed, 0 failed
