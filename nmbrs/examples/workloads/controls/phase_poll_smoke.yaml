# SRD-75 phase-poll smoke test.
#
# Exercises the phase-poll surface end-to-end — parse, scope
# synthesis, per-iteration capture, predicate re-evaluation, and
# predicate-satisfied loop exit — with NO external dependency.
#
# The testkit adapter returns a synthetic structured result
# (`result:`), so the op's `capture:` path-expressions read
# author-controlled state instead of a live backend's. The state
# is chosen to satisfy the `until:` predicate, so the loop exits by
# predicate-satisfaction rather than timeout. (`on_timeout` defaults
# to Error, so a timeout would fail the phase — `#@ expect 0 failed`
# below therefore proves the predicate actually fired.)

scenarios:
  default:
    - ensure

phases:
  ensure:
    adapter: testkit
    cycles: 1
    concurrency: 1
    poll:
      # Polydat comparison operators return u64 (0/1) and there is
      # no `&&` — boolean clauses are combined via bitwise `&`
      # with explicit parens (operator precedence puts `&`
      # above `==`). SRD-75 documents this in the workload-
      # author guide.
      until: "(sstables == 1) & (active_for_cf == 0) & (pending_for_cf == 0)"
      interval_ms: 50
      # Generous bound: the synthetic state satisfies the predicate
      # on the first poll, so the loop never reaches this. A timeout
      # would fail the phase (on_timeout defaults to Error).
      timeout_ms: 2000
      max_error_retries: 0
      metric_name: ensure_smoke_wait_s
    ops:
      read_state:
        # Synthetic "compaction state" the predicate inspects:
        #   /0/value        → sstables       = 1   (compacted to one)
        #   /1/value:count  → active_for_cf  = 0   (no active compactions)
        #   /2/value        → pending_for_cf = 0   (none pending)
        # These values satisfy the `until:` predicate above.
        # (`result-body`, not `result:` — the latter is the reserved
        # SRD-66 result-bindings block.)
        result-body:
          - value: 1
          - value: []
          - value: 0
        capture:
          sstables:       "/0/value"
          active_for_cf:  "/1/value:count"
          pending_for_cf: "/2/value"
        memo:
          before: "polling state"
          after:  "compacted"

# ─── verification (nmbrs check / example-walker) ───
# Runs standalone — the predicate is satisfied from synthetic state,
# so the phase completes cleanly with no failures.
#@ run cycles=1
#@ expect 0 failed
