#!/usr/bin/env nmbrs
# Windowed attempt-level saturation breaker — why a rate beats an absolute floor,
# and why the query must be scoped to the phase it judges.
#
# The companion to error_rate_circuit_breaker.yaml. That one shows a breaker
# firing on a RESULT-level rate. This one shows the case that breaker CANNOT
# catch, and the windowed ATTEMPT-level guard that does.
#
# The failure it encodes (an incremental compaction sweep, 2026-08-25): a run stayed
# alive through a fully saturated error rate, because BOTH of its breakers are
# structurally unable to fire in that state.
#
#   1. The windowed RESULT-level clause needs an absolute floor of TERMINAL
#      failures inside the window. A terminal failure only lands once the whole
#      `tries:` budget is spent, so a stalled loader produces very few per
#      window and the floor is unreachable exactly when it matters. An absolute
#      count is not scale-invariant: it means something different at 20 ops/s
#      than at 20,000.
#
#   2. The ATTEMPT-level clause sees through retries, but divides by LIFETIME
#      totals, so a long healthy past hides a fully-failing present.
#
# The fix is a WINDOWED ATTEMPT-level rate — same window in numerator and
# denominator, so it is scale-invariant and immune to run history.
#
# SECOND LESSON, found while writing this example. A windowed query MUST be
# scoped to the phase being judged. An unscoped `sum(increase(attempt_total[..]))`
# also counts the watch daemon's own successful polls (and, in the real workload,
# the query and recall phases that share a `part`). Measured here: a 100%-failing
# loader produced a windowed rate of 0.50, far under the 0.90 threshold, so the
# guard silently never fired. The production workload had the same defect and it
# is fixed there too.
#
# Usage:
#   nmbrs run workload=nmbrs/examples/workloads/controls/saturation_windowed_breaker.yaml
#   nmbrs run workload=nmbrs/examples/workloads/controls/saturation_windowed_breaker.yaml \
#       scenario=saturated

params:
  adapter: testkit
  # Deliberately LOW throughput: the point is that an absolute floor of 100
  # terminal failures per window cannot be reached here, while a rate can.
  rate: "20"
  concurrency: "4"
  cycles: "300"
  # The absolute floor the RESULT-level guard would need. Unreachable at this
  # throughput — which is the demonstration.
  result_failure_window_floor: "100"
  # The windowed ATTEMPT-level guard. The floor only keeps a cold-start blip from
  # tripping it; the RATE does the discriminating.
  attempt_saturation_rate: "0.90"
  attempt_window_floor: "20"
  errors: ".*:warn,counter"
  # Sub-second cadence so a 1s window settles inside a short example.
  metrics_cadence: 50ms

bindings: |
  shared recent_attempt_failures: f64 := 0.0
  shared recent_attempt_total:    f64 := 0.0
  shared recent_result_failures:  f64 := 0.0

scenarios:
  default:
    - watch_healthy
    - healthy
  saturated:
    - watch_saturated
    - saturated_load

phases:
  # ── the gauge-presentation path ──────────────────────────────────────────
  # Read the windowed counts through metricsql, publish them as gauges, and
  # leave them in shared wires for the loader's predicate. `volatile` marks the
  # reads as explicitly nondeterministic. One daemon per scenario because the
  # selector must name ONE literal phase — see the SECOND LESSON above.
  watch_healthy:
    daemon: true
    concurrency: 1
    rate: 20
    cycles: 100000
    tries: 1
    ops:
      sample:
        stmt: "SELECT 'watch';"
        result: |
          volatile recent_attempt_failures := metricsql_scalar("sum(increase(attempt_failure{phase=\"healthy\"}[1s]))")
          volatile recent_attempt_total := metricsql_scalar("sum(increase(attempt_total{phase=\"healthy\"}[1s]))")
          volatile recent_result_failures := metricsql_scalar("sum(increase(result_failure{phase=\"healthy\"}[1s]))")
        metrics:
          recent_attempt_failures: { kind: gauge, value: recent_attempt_failures }
          recent_attempt_total:    { kind: gauge, value: recent_attempt_total }
          recent_result_failures:  { kind: gauge, value: recent_result_failures }

  watch_saturated:
    daemon: true
    concurrency: 1
    rate: 20
    cycles: 100000
    tries: 1
    ops:
      sample:
        stmt: "SELECT 'watch';"
        result: |
          volatile recent_attempt_failures := metricsql_scalar("sum(increase(attempt_failure{phase=\"saturated_load\"}[1s]))")
          volatile recent_attempt_total := metricsql_scalar("sum(increase(attempt_total{phase=\"saturated_load\"}[1s]))")
          volatile recent_result_failures := metricsql_scalar("sum(increase(result_failure{phase=\"saturated_load\"}[1s]))")
        metrics:
          recent_attempt_failures: { kind: gauge, value: recent_attempt_failures }
          recent_attempt_total:    { kind: gauge, value: recent_attempt_total }
          recent_result_failures:  { kind: gauge, value: recent_result_failures }

  # ── healthy: no injected errors, neither guard trips ─────────────────────
  healthy:
    cycles: "{cycles}"
    rate: "{rate}"
    concurrency: "{concurrency}"
    stop_when:
      - when: "(recent_result_failures >= {result_failure_window_floor}) & (recent_result_failures > (recent_attempt_total + 1.0) * 0.025)"
      - when: "(recent_attempt_total >= {attempt_window_floor}) & (recent_attempt_failures > (recent_attempt_total * {attempt_saturation_rate}))"
    ops:
      query:
        stmt: "SELECT value FROM t WHERE id = {cycle};"

  # ── saturated: every attempt fails ───────────────────────────────────────
  # At rate 20 a 1s window holds ~20 attempts, so the RESULT-level guard's floor
  # of 100 terminal failures is unreachable no matter how long this runs. The
  # ATTEMPT-level guard divides by the same window it measures and fires.
  saturated_load:
    cycles: "{cycles}"
    rate: "{rate}"
    concurrency: "{concurrency}"
    stop_when:
      - when: "(recent_result_failures >= {result_failure_window_floor}) & (recent_result_failures > (recent_attempt_total + 1.0) * 0.025)"
      - when: "(recent_attempt_total >= {attempt_window_floor}) & (recent_attempt_failures > (recent_attempt_total * {attempt_saturation_rate}))"
    ops:
      query:
        stmt: "SELECT value FROM t WHERE id = {cycle};"
        result-error-rate: 1.0
        result-error-name: Timeout
        result-error-message: "synthetic stall — every attempt fails"

# ─── example-walker test directives ───
# Default: no injected errors, neither guard trips, run completes.
#@ run
#@ expect completed, 0 failed
# Saturated: the attempt window is 100% failed while terminal failures stay far
# below the absolute floor — only the windowed attempt-level guard can catch it.
#@ case saturated
#@   run scenario=saturated
#@   expect-fail stop condition tripped
