#!/usr/bin/env nmbrs
# Error-rate circuit breaker — count errors, fail only above a budget.
# (SRD-82 ErrorPolicy + SRD-83 stop conditions.)
#
# The lesson from a long incremental compaction sweep: occasional Timeout
# errors STOPPED the workload, when they should have been COUNTED and the
# run continued — failing only if the OVERALL error rate became unhealthy.
# Two orthogonal knobs express that policy:
#
#   1. `errors: ".*:warn,counter"` (top-level, inherited by every phase)
#      routes EVERY op error to log-a-warning + tally and KEEPS RUNNING —
#      no per-op stop. The op is still a terminal failure, so it feeds the
#      error rate; the policy only decides it isn't fatal on its own.
#      (Default policy is stop-on-error — that is what halted the original
#      run on the first timeout.)
#
#   2. a per-phase async `stop_when:` guard over the phase's live runtime
#      wires fails the run if the windowed error rate crosses 1%:
#
#        stop_when:
#          - when: "(cycles_total > 100) & (to_f64(result_failure) > (to_f64(cycles_total) * 0.01))"
#
#      `error_rate` is a faithful ratio — result_failure / op_count, in
#      [0,1] (terminal per-op failures; retries do NOT inflate it). The
#      executor re-snapshots it OFF the op path on the activity drain
#      cadence (~5 ms), so the guard runs ASYNC and trips the moment the
#      live ratio crosses the threshold. `effect` defaults to `fail` → the
#      phase ends Failed → the run exits non-zero with the reason on stderr.
#
#      COMPOUND guard: the `op_count > 100` clause is the whole point of
#      the `&`. error_rate is a ratio, so a single early error spikes it
#      (1 error in 1 op = 100%); gating on `op_count > 100` lets the rate
#      stabilize over a real sample before the breaker can fire — without
#      it, ANY phase that errored on its first op would trip immediately.
#      polydat predicates have NO `&&`: combine clauses with bitwise `&`
#      and explicit parens (`&` binds above `>`), exactly as a `poll:
#      until:` predicate does.
#
# testkit injects errors deterministically (`xxh3(cycle) < rate`), so both
# outcomes are reproducible with NO database / dataset:
#   default scenario `steady`   — 0.1% Timeouts → under budget → COMPLETES
#                                  (a few WARN lines: the errors are
#                                  counted, the run is not aborted).
#   scenario `degraded`         — 6% Timeouts → over budget → the guard
#                                  FAILS the run just past op 100 (NOT on
#                                  the first error — the op_count clause
#                                  holds it off).
#
# Usage:
#   nmbrs run workload=nmbrs/examples/workloads/controls/error_rate_circuit_breaker.yaml
#   nmbrs run workload=nmbrs/examples/workloads/controls/error_rate_circuit_breaker.yaml \
#       scenario=degraded

params:
  adapter: testkit
  rate: "2000"
  concurrency: "8"
  # Count every error and keep running; the `stop_when` guard — not the
  # per-op policy — decides when the run is unhealthy enough to fail.
  errors: ".*:warn,counter"

scenarios:
  default:
    - steady
  degraded:
    - degraded_load

phases:
  # 0.1% injected Timeouts — comfortably under the 1% budget. The guard
  # never trips; the phase completes with the handful of timeouts counted.
  steady:
    cycles: 3000
    rate: "{rate}"
    concurrency: "{concurrency}"
    stop_when:
      - when: "(cycles_total > 100) & (to_f64(result_failure) > (to_f64(cycles_total) * 0.01))"
    ops:
      query:
        stmt: "SELECT value FROM t WHERE id = {cycle};"
        result-error-rate: 0.001
        result-error-name: Timeout
        result-error-message: "synthetic read timeout (counted; under budget)"

  # 6% injected Timeouts — over budget. Same policy + guard; now the error
  # rate crosses 1% and the async breaker fails the run just after op 100.
  degraded_load:
    cycles: 3000
    rate: "{rate}"
    concurrency: "{concurrency}"
    stop_when:
      - when: "(cycles_total > 100) & (to_f64(result_failure) > (to_f64(cycles_total) * 0.01))"
    ops:
      query:
        stmt: "SELECT value FROM t WHERE id = {cycle};"
        result-error-rate: 0.06
        result-error-name: Timeout
        result-error-message: "synthetic read timeout (error rate exceeded budget)"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
# Default `steady`: timeouts stay under budget → run completes, no failed
# phases (errors are counted, not fatal).
#@ run
#@ expect completed, 0 failed
# `degraded`: error rate exceeds 1% → the async guard fails the run.
#@ case degraded
#@   run scenario=degraded
#@   expect-fail stop condition tripped
