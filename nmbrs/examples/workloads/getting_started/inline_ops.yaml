# inline_ops.yaml — a basic stdout workload and the op= command line it equals.
#
# Both of these print the SAME lines (run either — both use the default
# `stdout` adapter, which echoes each op's rendered `stmt`):
#
#   nmbrs run workload=nmbrs/examples/workloads/getting_started/inline_ops.yaml cycles=8
#   nmbrs run op='3:read id={{mod(hash(cycle),1000000)}};1:write id={{mod(hash(cycle),1000000)}}' cycles=8
#
# The one-liner de-sugars to exactly the two ops below: a top-level `;`
# separates ops, an `N:` prefix sets the ratio, and `{{expr}}` is evaluated
# per cycle into the rendered line. (See op_inline_forms.yaml for every
# de-sugaring rule, and `dryrun=wiring` to print the expansion.)
#
# Example output (3 reads per write, ids are mod(hash(cycle), 1e6)):
#   read id=527897
#   read id=564547
#   read id=960189
#   write id=460078

params:
  adapter: stdout

bindings: |
  input cycle: u64
  user_id := mod(hash(cycle), 1000000)

ops:
  # 3 reads per 1 write — the `ratio:` weights match the `N:` prefixes above.
  read:
    ratio: 3
    stmt: "read id={user_id}"
  write:
    ratio: 1
    stmt: "write id={user_id}"

