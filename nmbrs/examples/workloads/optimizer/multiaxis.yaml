# optimizer_multiaxis.yaml — SRD-86 multi-axis adaptive tuning (CMA-ES)
#
# Tuning MORE THAN ONE knob at once. The phase `for_each` is multi-clause, so the
# optimizer searches a multi-dimensional space:
#
#     for_each: "x in 0.0 .. 6.0, y in 0.0 .. 8.0"
#
# Both axes are CONTINUOUS (float ranges → sampled, not enumerated), and the
# method is `cmaes` — a population-based metric-space solver that climbs a real
# manifold. The objective is a synthetic 2-D paraboloid peaked at (3, 5), so the
# search converges to x≈3, y≈5 — coordinates no grid would have named.
#
# DISCRETE multi-axis works the same way — just write detent lists instead of
# ranges (`for_each: "x in [1.0,2.0,3.0], y in [1.0,2.0,3.0]"`) and pick a solver.
# Use FLOAT detents (`1.0`, not `1`) for numeric axes: an integer-typed axis makes
# the iter-var a u64, and signed objective math like `0 - (x-3)^2` then underflows.
#
# Runs standalone:
#   nmbrs run workload=nmbrs/examples/workloads/optimizer_multiaxis.yaml \
#       --session-path /tmp/opt-multiaxis
#
# The objective is maximized (score = 0) at (x, y) = (3, 5).

description: |
  SRD-86 multi-axis search: a multi-clause `for_each` over two continuous axes,
  searched by the `cmaes` population solver against a synthetic 2-D manifold. The
  search converges to the interior peak (3, 5) — the canonical "tune several
  continuous knobs at once" form.

phases:
  tune:
    cycles: 1
    # Two continuous axes (multi-clause for_each) → a 2-D search space.
    for_each: "x in 0.0 .. 6.0, y in 0.0 .. 8.0"
    optimize:
      method: cmaes
      objective: score
      max_evals: 60
    # A synthetic 2-D paraboloid, peaked (score = 0) at (3, 5).
    bindings: |
      score := 0 - (x - 3) * (x - 3) - (y - 5) * (y - 5)
    ops:
      probe:
        adapter: stdout
        params:
          stdout: eventlog
        stmt: "probe x={x} y={y}"

