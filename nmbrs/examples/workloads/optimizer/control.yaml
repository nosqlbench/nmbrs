# optimizer_control.yaml — SRD-86 §4 Control-class actuation (live retarget)
#
# The third member of the optimizer family. optimizer_saturation and
# optimizer_metricsql search `concurrency` by RE-RUNNING the phase once per
# coordinate (Coordinate actuation). This workload searches the SAME axis, the
# SAME backend, the SAME objective — but names the axis in `servo:`,
# so the optimizer becomes a SERVOING DAEMON: it runs ONE continuous phase and
# live-retargets the `concurrency` control (SRD-23, no restart) between settings,
# settling the windowed objective at each before stepping. No phase reruns.
#
# `concurrency: "{conc}"` both (a) starts the phase at a warmup setting and
# (b) tells the classifier which live control the `conc` axis drives. The phase
# runs continuously; the daemon retargets concurrency 32 → 2, settles
# `sum(rate(errors_total[400ms]))` at each (the 400ms window clears the prior setting
# before the value is trusted — SRD-86 §6 step 2), and stops the phase once the
# search is done. `score = -err_rate` is maximized (≈ 0) at the lowest
# concurrency (conc=2), which fits the 2-server / depth-4 backend.
#
# `error_rate_max: 1.0` compiles to `error_rate > 1.0`, which can never trip
# (a rate is in [0,1]) — i.e. "allow 100% overload". A Control-class phase is ONE
# continuous run that deliberately dwells at a saturating setting while the
# daemon explores, so it must NOT carry a tripping error guard; the per-rerun
# optimizer_saturation / optimizer_metricsql workloads can, because each short
# rerun never sustains 100%.
#
# Runs standalone:
#   nmbrs run workload=nmbrs/examples/workloads/optimizer_control.yaml \
#       --session-path /tmp/opt-control

description: |
  SRD-86 Control-class actuation: the optimizer servos a live `concurrency`
  control (SRD-23 retarget, no restart) across ONE continuous phase, settling a
  windowed MetricsQL objective per setting — finding the concurrency that
  eliminates backend overloads without ever rerunning the phase.

# Sub-second metrics cadence: the SRD-86 settle detector samples the
# objective on the finest cadence pulse, so a 50ms cadence (vs the 1s
# default) settles the windowed objective in a fraction of the wall-clock.
# Paired with the short rate() window below — both scale down together, so
# the SIGNAL is unchanged, only the wall-clock shrinks. Works as a CLI
# override too (`metrics_cadence=50ms`); the workload value is the default.
params:
  metrics_cadence: 50ms

phases:
  saturate:
    # ONE continuous phase: sized generously so the daemon (≈ one settle window
    # per setting) finishes and stops it early; if it runs out first, the daemon
    # uses the best setting found so far.
    cycles: 30000
    # The phase starts here (warmup setting); the servo retargets the live
    # concurrency control from this point. The `{conc}` reference also tells the
    # classifier that the `conc` axis drives the `concurrency` control.
    concurrency: "{conc}"
    # Offered `rate` × backend `result-latency` (below) is the in-flight depth
    # that decides overload, so they move together: `rate` is quartered and
    # `result-latency` quadrupled, holding `rate×latency` (≈ saturating
    # in-flight) constant. The SIGNAL is unchanged — conc=32 still saturates,
    # conc=2 still doesn't — but the op throughput is 4× lower, so a swarm of
    # these running concurrently contends far less for CPU and the settle's
    # wall-clock window stays representative (less load-sensitive).
    rate: 500
    # Overload errors are the objective SIGNAL, not failures — warn, and never
    # stop on the error rate (see the header note on `error_rate_max: 1.0`).
    errors: warn
    error_rate_max: 1.0
    # The search axis. `servo: conc` opts it into live-retarget actuation
    # (SRD-86 §4) — the daemon servos it instead of rerunning the phase.
    for_each: "conc in 32, 2"
    optimize:
      objective: score
      max_evals: 10
      # Servo `conc` as a live control (retarget without restarting the phase).
      # Every other axis steps through by re-running; naming it here opts into
      # servoing. Validated: `conc` must sink into a control AND the objective must
      # be windowed (it is, below).
      servo: conc
    bindings: |
      input cycle: u64
      # SYNTHETIC saturation signal (SRD-89): the LIVE per-execution concurrency
      # setting. `control_u64` is volatile and — now that control reads resolve
      # off THIS execution's own phase control — tracks the servo's retarget, so
      # `load` reads 32 at the warmup point and 2 once the servo steps down.
      load := control_u64("concurrency")
      # The windowed Overload error FRACTION (errors over OPS, not errors over
      # TIME), read through the MetricsQL engine over this run's live metrics.
      # Both are CUMULATIVE counters, so each rate(...[400ms]) is a per-setting
      # delta (the prior setting's baseline cancels in the difference); the
      # RATIO then cancels the op throughput too:
      #   sum(rate(errors[W])) / sum(rate(cycles[W]))
      #     = (Δerrors/W) / (Δcycles/W) = Δerrors / Δcycles = errors per op.
      # That matters because errors-per-op is the SYNTHETIC, load-independent
      # signal (1.0 at a saturating setting, 0.0 at a safe one), whereas
      # errors-per-second = errors-per-op × ops-per-second drags in the
      # wall-clock op throughput — which the op-rate cap and CPU contention DO
      # move, even though the overload decision itself does not. The settle's
      # min_viable gate (sized to the 400ms window) still holds the verdict until
      # the window has cleared the prior setting.
      err_frac := metricsql_scalar("sum(rate(errors_total[400ms])) / sum(rate(cycles_total[400ms]))")
      # Maximize -err_frac: the concurrency with the smallest error fraction wins.
      score := 0 - err_frac
    ops:
      insert:
        adapter: testkit
        stmt: "INSERT INTO demo.events (id) VALUES ({cycle});"
        # SYNTHETIC saturation (SRD-86 §6 / SRD-89): overload is a deterministic
        # function of the live SETTING, not host timing. The op reports
        # `result-load = {load}` (the live concurrency) and the backend rejects
        # with Overload when load > result-overload. So conc=32 overloads on
        # every op (err_rate > 0) and conc=2 never does (err_rate = 0) — identical
        # serial or under concurrent CPU pressure (no real host saturation
        # required), which is what makes the in-process walker deterministic.
        result-load: "{load}"
        result-overload: 4
        # Pacing only — each served op takes 20ms so cycles span the 400ms settle
        # window. (No `result-capacity`: overload is synthetic, not a measured
        # permit pool.)
        result-latency: "20ms"

# ─── example-walker test directives (nmbrs/tests/example_workloads_in_process.rs) ───
#@ expect \(control\): best \[2\]
