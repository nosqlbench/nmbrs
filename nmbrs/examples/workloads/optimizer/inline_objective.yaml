# optimizer_inline_objective.yaml — SRD-86 inline objective expression
#
# `optimize.objective` accepts not only a bare wire name (a `bindings:` entry)
# but a full polydat EXPRESSION written inline. Where optimizer_continuous
# declares `score := 0 - (ef-4)*(ef-4)` in `bindings:` and points
# `objective: score` at it, this workload writes the same objective DIRECTLY in
# the `optimize:` block — no separate binding. The runtime lowers the inline
# expression to a synthesized `__objective` wire on the phase kernel
# (`scope::objective_wire`), so the two forms behave identically.
#
# A bare identifier (`objective: score`) is still read directly; anything with
# operators or calls (`objective: "0 - metricsql_scalar(...)"`) is synthesized.
#
# Usage (runs standalone):
#   nmbrs run workload=nmbrs/examples/workloads/optimizer_inline_objective.yaml \
#       --session-path /tmp/opt-inline
#
# The objective is maximized (= 0) at ef=4.

description: |
  SRD-86 inline objective: the `optimize.objective` is a polydat expression
  written directly in the block (no `bindings:` entry), lowered to a synthesized
  `__objective` wire. `nelder_mead` climbs the parabola to its peak at ef≈4.

phases:
  search:
    cycles: 1
    # Continuous search axis — the optimizer samples the real interval.
    for_each: "ef in 1.0 .. 5.0"
    optimize:
      method: nelder_mead
      # Inline objective EXPRESSION — no `bindings:` entry needed. Lowered to a
      # synthesized `__objective` wire on the phase kernel.
      objective: "0 - (ef - 4) * (ef - 4)"
      max_evals: 25
    ops:
      probe:
        adapter: stdout
        params:
          stdout: eventlog
        stmt: "probe ef={ef}"

