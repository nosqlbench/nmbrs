# optimizer_categorical.yaml — SRD-86 categorical (label) axis
#
# Choosing the best of a set of NAMED options. A categorical axis is a list of
# string labels — nominal choices with no order or distance between them, so the
# optimizer visits them by index rather than treating them as numbers:
#
#     for_each: 'mode in ["alpha", "beta", "gamma"]'
#
# Labels MUST be quoted — a bare word is a wire reference, not a string literal
# (SRD-18f). The default `sweep` (identity) optimizer visits every option; a value-native
# method picks the best by the objective. Here a synthetic objective scores
# `beta` highest, so the search reports `best [beta]`. In a real workload the
# objective would be a run-produced metric (see optimizer_metricsql.yaml) and the
# label would select, e.g., a consistency level or a named strategy.
#
# Runs standalone:
#   nmbrs run workload=nmbrs/examples/workloads/optimizer_categorical.yaml \
#       --session-path /tmp/opt-categorical
#
# The objective is maximized (score = 1) at mode = beta.

description: |
  SRD-86 categorical search: an optimize axis of named string options (no
  order/distance), visited by the default `sweep` value-native optimizer. The objective
  selects `beta` — the "pick the best of these named options" form.

phases:
  pick:
    cycles: 1
    # A categorical axis: quoted string labels (bare words are wire refs).
    for_each: 'mode in ["alpha", "beta", "gamma"]'
    optimize:
      objective: score
      max_evals: 10
    # Synthetic objective: `beta` scores 1, the others 0. In a real workload this
    # would read a run-produced metric for the option that `mode` selected.
    bindings: |
      score := if(mode == "beta", 1.0, 0.0)
    ops:
      probe:
        adapter: stdout
        params:
          stdout: eventlog
        stmt: "probe mode={mode}"

