#!/usr/bin/env nmbrs
# polar_rose.yaml — Polar rose curve
#
# A rose curve in polar coordinates: r = cos(k * theta)
# k=2 → 4 petals, k=3 → 3 petals, k=5/3 → intricate pattern
#
# The plotter's polar mode interprets the first two outputs as
# (r, theta) and converts to Cartesian for display.
#
# Usage:
#   nmbrs run workload=nmbrs/examples/workloads/visual/polar_rose.yaml
#   nmbrs run workload=nmbrs/examples/workloads/visual/polar_rose.yaml k=5 cycles=5000
#   nmbrs run workload=nmbrs/examples/workloads/visual/polar_rose.yaml k=2.5 cycles=10000

params:
  adapter: plotter
  k: "3"
  cycles: "3000"

# `k` injects as a bare wire — reference it by name (braces are rejected
# inside Polydat expressions). `mode` is omitted; the plotter infers
# `polar` from the `r`/`theta` op-field names.
bindings: |
  input cycle: u64
  theta := to_f64(cycle) * 0.01
  r := cos(theta * k)

ops:
  point:
    r: "{r}"
    theta: "{theta}"

