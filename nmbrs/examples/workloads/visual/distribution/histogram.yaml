#!/usr/bin/env nmbrs
# Copyright 2024-2026 Jonathan Shook
# SPDX-License-Identifier: Apache-2.0
#
# Distribution histograms — value × frequency.
#
# `mode=histogram` bins each field's accumulated samples across the
# plot width and draws the per-bin count as bar height. With one field
# per lane, the three distributions stack as recognizable shapes:
#   normal       → a bell centered on the mean
#   exponential  → a tall ramp at 0 decaying right
#   uniform      → a flat top
#
# Every `dist_*` sampler takes a [0,1) value, so each hash is bridged
# through `unit_interval`. Independent streams come from re-hashing
# (`hash(hash(...))`) so the three fields aren't rank-correlated.

params:
  adapter: plotter
  cycles: "6000"
  mode: histogram

bindings: |
  input cycle: u64
  uniform     := unit_interval(hash(cycle))
  normal      := dist_normal(unit_interval(hash(hash(cycle))), 0.5, 0.15)
  exponential := dist_exponential(unit_interval(hash(hash(hash(cycle)))), 2.0)

ops:
  sample:
    uniform: "{uniform}"
    normal: "{normal}"
    exponential: "{exponential}"

