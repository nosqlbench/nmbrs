#!/usr/bin/env nmbrs
# phase_gutters.yaml — per-phase contextual gutter cells
#
# Each phase owns the compact cell to the LEFT of its detail row
# (the stats line under the phase header). Without a declaration
# the display derives it automatically:
#
#   - metered phases  → braille completion bar
#   - daemon phases   → service-time latency sparkline (p50∕p99)
#
# The `gutter:` op wrapper overrides that derivation with a
# workload-computed value, published after each successful op:
#
#   gutter: "<layout template>"     printf-style polydat layout
#                                   string, shown verbatim
#   gutter: { bar: "<template>" }   renders to an f64 in 0..=1,
#                                   shown as the house braille bar
#   gutter: { spark: "<template>" } renders to an f64 sample,
#                                   shown as a sparkline trend +
#                                   current value
#
# Usage:
#   nmbrs run workload=nmbrs/examples/workloads/visual/phase_gutters.yaml
#
#@ expect completed, 0 failed

scenarios:
  default:
    - auto_latency
    - auto_bar
    - custom_bar
    - custom_spark
    - custom_text
    - key_metric
    - key_metric_recall

phases:
  # Daemon phase, no gutter declaration → automatic latency trend
  # in the cell; the header meter slot stays empty (open-ended).
  auto_latency:
    adapter: testkit
    daemon: true
    concurrency: 2
    # Open-ended cursor — the daemon runs until the scenario's
    # foreground phases finish (its stop signal cuts it), with a
    # wall-clock ceiling as the backstop. No fixed cycle target
    # means no progress meter — the latency cell takes that space.
    bindings: |
      cursor c = until_elapsed(1000, 600000)
    ops:
      probe:
        readout: visible
        result-latency: 20ms
        result-body:
          - value: 1

  # Metered phase, no gutter declaration → automatic completion
  # bar (cycles basis).
  auto_bar:
    adapter: testkit
    cycles: 1500
    concurrency: 4
    ops:
      work:
        readout: visible
        result-latency: 10ms
        result-body:
          - value: 1

  # Custom BAR: the fraction is computed by polydat, not by the
  # cycle counter — here a deliberately non-linear ease-out curve,
  # the shape a byte-drain or backlog meter would have.
  custom_bar:
    adapter: testkit
    cycles: 1000
    concurrency: 4
    bindings: |
      input cycle: u64
      remain := 1.0 - to_f64(cycle) / 1000.0
      eased := 1.0 - remain * remain * remain
    ops:
      drain:
        readout: visible
        result-latency: 10ms
        result-body:
          - value: 1
        gutter: { bar: "{eased}" }

  # Custom SPARK: each op publishes one computed sample; the cell
  # shows the trend ring + current value. Any measured quantity
  # works — queue depth, hit ratio, rows/s.
  custom_spark:
    adapter: testkit
    cycles: 1000
    concurrency: 4
    bindings: |
      input cycle: u64
      wave := 50.0 + 40.0 * sin(to_f64(cycle) * 0.02)
    ops:
      sample:
        readout: visible
        result-latency: 10ms
        result-body:
          - value: 1
        gutter: { spark: "{wave}" }

  # Custom TEXT: a printf-style layout string fills the cell
  # verbatim — compose your own glyphs and values.
  custom_text:
    adapter: testkit
    cycles: 800
    concurrency: 4
    bindings: |
      input cycle: u64
      lap := cycle % 100
    ops:
      step:
        readout: visible
        result-latency: 10ms
        result-body:
          - value: 1
        gutter:
          text: "lap {lap}∙c {cycle}"
          # `final:` — evaluated ONCE at phase end and rendered as the
          # ✓ outcome detail line's gutter cell. May reference status
          # metrics ({recall}, {latency_p50}, …) resolved from the
          # phase aggregates. Without `final:` the during-form's last
          # published value is the final cell.
          final: "done: p50 {latency_p50}"

  # KEY METRICS (SRD-92 R4): `status_metrics:` chips get their own
  # detail row under the counters line, and that row's gutter cell
  # defaults to the METRIC MACRO — a bright trend sparkline of the
  # primary key metric, labeled by name. The current numeric stays in
  # the row body (single placement); the standard detail row keeps its
  # automatic completion bar; the cells stack under the header's triad.
  key_metric:
    adapter: testkit
    cycles: 1200
    concurrency: 4
    status_metrics: [latency_p50, latency_p99]
    ops:
      probe:
        readout: visible
        result-latency: 10ms
        result-body:
          - value: 1

  # RELEVANCY key metric: the same macro driven by a measured recall
  # aggregate. The op's fixed 3-row body is scored against a literal
  # ground truth by the standard `evaluations.relevancy` pipeline —
  # keys {0,1,5} vs truth {0,1,2} at k=3 → a deterministic
  # recall:66.67% chip in the row body, `recall` trend in the cell.
  key_metric_recall:
    adapter: testkit
    cycles: 800
    concurrency: 4
    status_metrics: [recall]
    bindings: |
      input cycle: u64
      ground_truth := "0,1,2"
    ops:
      probe:
        stmt: "ping"
        readout: visible
        result-latency: 10ms
        result-body:
          - key: "0"
          - key: "1"
          - key: "5"
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: 3
            r: 3
            functions: [recall]
