[package]
name = "nmbrs-adapter-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Testkit adapter for nmbrs: simulates operation execution with configurable results, latency, and error injection"
keywords = ["nosqlbench", "workload", "benchmark", "simulation"]
categories = ["command-line-utilities", "simulation"]
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
nmbrs-runtime = { workspace = true }
nmbrs-adapter-stdout = { workspace = true }
nmbrs-workload = { workspace = true }
tokio = { version = "1", features = ["time", "sync"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
polydat = "0.6.2"
inventory = "0.3.24"
