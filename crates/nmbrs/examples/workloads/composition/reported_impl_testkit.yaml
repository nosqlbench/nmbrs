#!/usr/bin/env nmbrs
# reported_impl_testkit.yaml — testkit implementation of
# reported_blueprint.yaml. Protocol matter only: the blueprint
# owns the pacing, the metrics, and the report (tables + chart),
# so this file stays two literal op bodies.
#
#   nmbrs run workload=reported_impl_testkit.yaml

implements: ./reported_blueprint.yaml

phases:
  work:
    ops:
      step:
        adapter: testkit
        stmt: "WORK"
  probe:
    ops:
      sample:
        adapter: testkit
        stmt: "PROBE"

# ─── verification (nmbrs check / example-walker) ───
#@ run
#@ expect 4 completed, 0 failed
