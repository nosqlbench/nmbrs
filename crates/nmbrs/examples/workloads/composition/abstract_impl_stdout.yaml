#!/usr/bin/env nmbrs
# abstract_impl_stdout.yaml — SRD-108 Part B: an IMPLEMENTATION
# of abstract_blueprint.yaml.
#
# `implements:` names the blueprint (file-relative, like
# `extends:`); invoking THIS file pulls the blueprint and binds
# this op body into its `probe.search` slot. Scaffolding (cycles,
# params) comes from the blueprint; the request shape comes from
# here.

implements: ./abstract_blueprint.yaml

phases:
  probe:
    ops:
      search:
        stmt: "SEARCH k={suite_k}"

#@ run
#@ expect SEARCH k=7
#@ expect 1 completed, 0 failed
