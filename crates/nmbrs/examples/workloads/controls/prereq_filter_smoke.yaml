#!/usr/bin/env nmbrs
# prereq_filter_smoke.yaml — SRD-106 coverage: the `phases=` filter's
# prereq exemption and its scope-liveness boundary.
#
# `prep` (root level) and `side_prep` (inside a sibling scope) are
# declared `checkpoint: idempotent` — the prereq class. The rules
# under test:
#
#   1. A prereq in a LIVE scope stays in the walk even when the
#      filter doesn't name it (provenance decides skip-or-run).
#   2. Scope liveness comes from SELECTED phases only: a scope whose
#      only selected-phase candidates don't match is elided whole,
#      prereqs included — an unselected section never drags its own
#      prereq chain into execution.
#
# So: `phases=measure_a` runs prep + measure_a, elides the sibling
# scope entirely (no side_prep, no measure_b); `phases=measure_b`
# runs prep, side_prep, and measure_b, skipping measure_a.
#
# Self-contained: default adapter, no params. Run under a sandbox
# --session-path; never from the project root.

# Two params with DISJOINT consumers (SRD-107): `run_tag` is
# consumed only by `prep` (its `{run_tag}` binding ref below);
# `probe_tag` only by `measure_a`. The refine validity tests flip
# each from the CLI to prove per-phase precision — a consumed
# param's change re-runs its consumer (naming the param), while an
# unconsumed one leaves the prereq's provenance intact.
params:
  run_tag: "a"
  probe_tag: "x"

scenarios:
  default:
    - prep
    - measure_a
    - for: 'section in "b"'
      phases:
        - side_prep
        - measure_b

phases:

  prep:
    checkpoint: idempotent
    cycles: 1
    concurrency: 1
    # The `{run_tag}` ref makes prep CONSUME run_tag (the SRD-107
    # textual leg) — and keeps the param referenced for the
    # unused-param validator.
    bindings: |
      const tag := "{run_tag}"
    ops:
      t:
        stmt: "PREP_TICK"

  measure_a:
    cycles: 2
    concurrency: 1
    # measure_a consumes probe_tag; prep does not — the
    # per-phase precision the SRD-107 tests pin.
    bindings: |
      const ptag := "{probe_tag}"
    ops:
      t:
        stmt: "A_TICK"

  side_prep:
    checkpoint: idempotent
    cycles: 1
    concurrency: 1
    ops:
      t:
        stmt: "SIDE_PREP_TICK"

  measure_b:
    cycles: 2
    concurrency: 1
    ops:
      t:
        stmt: "B_TICK"

# ─── example-walker test directives ───
#@ case unfiltered
#@   run scenario=default
#@   expect completed, 0 failed
#@ case prereq_exemption
#@   run scenario=default phases=measure_a
#@   expect kept as an idempotent prerequisite
#@   expect completed, 0 failed
