# Petstore 1.0.0 — http op templates
#
# Generated by `openapi-ops` from petstore.openapi.json. Each operation below is a
# reusable http request with the fields it needs declared under
# `abstract.needs`. A workload `extends:` this file and instantiates an
# operation with `uses: <operationId>`, supplying every need with a binding
# (the op's, or its phase's, workload's, or scenario's) or a declared param:
#
#   extends: ./<this file>
#   phases:
#     main:
#       cycles: 1000
#       ops:
#         my_op:
#           uses: <operationId>
#           bindings: |
#             <need> := <expression>
#
# The request shape is fixed by the template; the workload qualifies it.
# These are http requests: run the workload with `adapter=http`, and
# `base_url=` to point it at a service other than the default below.
# Regenerate rather than edit: changes belong in the spec.

description: "Petstore 1.0.0 http op templates"

params:
  base_url: "http://localhost:8080/v1"

op_templates:
  # POST /pets
  # optional, not templated: age (u64)
  addPet:
    description: "Add a pet"
    abstract:
      needs:
        name: String
        owner_id: u64
    method: POST
    uri: "{base_url}/pets"
    content_type: "application/json"
    body: "{\"name\": \"{name}\", \"owner\": {\"id\": {owner_id}}}"
    tags:
      api_tag: "pets"

  # GET /pets/{pet-id}
  getPetById:
    description: "Find a pet by id"
    abstract:
      needs:
        pet_id: u64
    method: GET
    uri: "{base_url}/pets/{pet_id}"
    tags:
      api_tag: "pets"

  # GET /pets
  # optional, not templated: tag (String)
  listPets:
    description: "List pets, a page at a time"
    abstract:
      needs:
        limit: u64
    method: GET
    uri: "{base_url}/pets?limit={limit}"
    tags:
      api_tag: "pets"

