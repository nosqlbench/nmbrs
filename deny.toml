# cargo-deny policy — run `cargo deny check`.
# Advisories: every vulnerability is an error; unmaintained/unsound
# crates we have consciously accepted are listed with the reason and
# the path that would retire them.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: proc-macro used by polydat-core; retire when polydat drops it.
    "RUSTSEC-2024-0436",
    # adler / serial: dev-dependencies only (shadow-terminal PTY test
    # harness → portable-pty / tattoy-wezterm-term); never in a shipped binary.
    "RUSTSEC-2025-0056",
    "RUSTSEC-2017-0008",
    # ttf-parser: via plotters' bundled-font glyph rasterizer; retire when
    # plotters moves off ab_glyph 0.2.
    "RUSTSEC-2026-0192",
    # lru 0.12 unsoundness: reachable only through ratatui 0.29 (and
    # vectordata); fixed in lru >= 0.18.2, which needs the ratatui 0.30
    # upgrade of nmbrs-tui. Tracked as a follow-up.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
