[package]
name = "nmbrs-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web UI for nmbrs: htmx-powered dashboard for workload monitoring and control"
keywords = ["nosqlbench", "workload", "benchmark", "web-ui", "htmx"]
categories = ["command-line-utilities", "web-programming::http-server"]
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.15"
askama-derive-axum = "0.1"
nmbrs-metrics = { path = "../nmbrs-metrics", version = "0.1.2" }
polydat = "0.3"
nmbrs-runtime = { path = "../nmbrs-runtime", version = "0.1.2" }
socket2 = "0.5"

[dev-dependencies]
# Tower `ServiceExt::oneshot` lets integration tests drive the
# Axum router without binding a real socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
