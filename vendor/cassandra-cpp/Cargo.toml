[package]
description = "Rust wrapper over the Apache Cassandra C++ driver — the nmbrs fork of cassandra-cpp 3.0.2, adding server-side trace capture."
documentation = "https://docs.rs/nmbrs-cassandra-cpp"
repository = "https://github.com/nosqlbench/nmbrs"
readme = "README.md"
keywords = [ "Cassandra", "binding", "CQL", "client", "database" ]
categories = [ "api-bindings", "database", "external-ffi-bindings", "asynchronous" ]
license = "Apache-2.0"
name = "nmbrs-cassandra-cpp"
version = "3.0.2"
authors = ["Keith Wansbrough <keithw@lochan.org>", "Jonathan Shook <jshook@gmail.com>"]
edition = "2018"
# Fork of upstream cassandra-cpp 3.0.2 with the trace_id retrieval
# surface added (see CHANGES.local.md). Published under its own name
# so the `engine-cassandra-cpp` feature of nmbrs-adapter-cql can be
# built from crates.io; dependents import it as `cassandra_cpp` via
# `package = "nmbrs-cassandra-cpp"`, so the wrapper's API paths are
# unchanged from upstream.
exclude = [".floki/", "floki.yaml", "scripts/", "tests/", "examples/"]

# The library keeps upstream's crate name so the fork stays a
# drop-in for code written against `cassandra_cpp::…`.
[lib]
name = "cassandra_cpp"

# The body is kept close to upstream so future re-syncs stay cheap,
# so upstream's clippy debt is not ours to relitigate site-by-site.
# Silence clippy for the whole package (lib + examples + tests) in
# one place rather than churning ~240 lint fixes into a fork we
# rebase; our own crates stay lint-gated.
[lints.clippy]
all = "allow"

[dependencies]
slog = { version = "2", optional = true }
log = { version = "0.4.17", optional = true }
cassandra-cpp-sys = "1.1.1"
uuid = "1.0"
error-chain = "0.12"
parking_lot = "0.12"
libc = "0.2"
bigdecimal = "0.4.2"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
futures = "0.3.1"
logtest = "2.0.0"

[features]
default = ["slog", "log"]
early_access_min_tls_version = ["cassandra-cpp-sys/early_access_min_tls_version"]
